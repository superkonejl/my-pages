<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>经典坦克大战</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100vw;
    height: 100vh;
    background-color: #000;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  /* 竖屏提示遮罩 */
  #portrait-warn {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    color: #f59e0b;
    text-align: center;
    padding: 20px;
  }
  @media (orientation: portrait) {
    #portrait-warn { display: flex; }
  }
  /* 主容器：左操控 - 中屏幕 - 右操控 */
  #app {
    display: flex;
    width: 100%;
    height: 100%;
    justify-content: space-between;
    align-items: center;
    padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .ctrl-zone {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  /* 十字方向键 */
  .dpad {
    position: relative;
    width: 170px;
    height: 170px;
  }
  .d-btn {
    position: absolute;
    background: #18181b;
    border: 2px solid #3f3f46;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #a1a1aa;
    font-size: 24px;
    font-weight: bold;
  }
  .d-btn.active {
    background: #f59e0b;
    color: #000;
    border-color: #fbbf24;
  }
  #btn-up { top: 0; left: 55px; width: 60px; height: 60px; }
  #btn-down { bottom: 0; left: 55px; width: 60px; height: 60px; }
  #btn-left { top: 55px; left: 0; width: 60px; height: 60px; }
  #btn-right { top: 55px; right: 0; width: 60px; height: 60px; }

  /* 开火与功能键 */
  #btn-fire {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #991b1b;
    border: 4px solid #ef4444;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
  }
  #btn-fire.active {
    background: #ef4444;
    transform: scale(0.95);
  }
  .top-bar {
    position: absolute;
    top: 15px;
    display: flex;
    gap: 12px;
  }
  .mini-btn {
    background: #27272a;
    border: 1px solid #52525b;
    color: #e4e4e7;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
  }
  /* 游戏画布与状态栏 */
  #game-wrap {
    height: 96vh;
    aspect-ratio: 1 / 1;
    position: relative;
    border: 3px solid #3f3f46;
    background: #09090b;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  #hud {
    position: absolute;
    top: 15px;
    left: 15px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 16px;
    font-weight: bold;
    color: #a1a1aa;
  }
  #hud span { color: #fff; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.82);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 32px;
    color: #f59e0b;
    letter-spacing: 2px;
  }
  #start-btn {
    background: #f59e0b;
    color: #000;
    border: none;
    padding: 12px 32px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div id="portrait-warn">
  <div>🔄 请将手机横屏握持</div>
  <div style="font-size:15px; color:#71717a; margin-top:10px;">横屏后自动进入战斗界面</div>
</div>

<div id="app">
  <!-- 左侧：状态与方向键 -->
  <div class="ctrl-zone">
    <div id="hud">
      <div>敌军: <span id="ui-enemy">20</span></div>
      <div>生命: <span id="ui-lives">3</span></div>
      <div>得分: <span id="ui-score">0</span></div>
    </div>
    <div class="dpad" id="dpad">
      <div class="d-btn" id="btn-up" data-dir="0">▲</div>
      <div class="d-btn" id="btn-right" data-dir="1">▶</div>
      <div class="d-btn" id="btn-down" data-dir="2">▼</div>
      <div class="d-btn" id="btn-left" data-dir="3">◀</div>
    </div>
  </div>

  <!-- 中间：战场主画面 -->
  <div id="game-wrap">
    <canvas id="canvas" width="416" height="416"></canvas>
    <div id="overlay">
      <h1 id="ov-title">TANK 1990</h1>
      <button id="start-btn">开始战斗</button>
    </div>
  </div>

  <!-- 右侧：功能与开火 -->
  <div class="ctrl-zone">
    <div class="top-bar">
      <button class="mini-btn" id="btn-fs">全屏</button>
      <button class="mini-btn" id="btn-pause">暂停</button>
    </div>
    <div id="btn-fire">开火</div>
  </div>
</div>

<script>
// 1. 动态注入 PWA Manifest 和离线 Service Worker
(function initPWA() {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#000"/><rect x="20" y="30" width="15" height="55" fill="#f59e0b"/><rect x="65" y="30" width="15" height="55" fill="#f59e0b"/><rect x="32" y="38" width="36" height="40" fill="#fbbf24"/><rect x="45" y="12" width="10" height="30" fill="#fff"/></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = iconUrl;
  document.head.appendChild(link);

  const manifest = {
    name: "经典坦克大战",
    short_name: "坦克大战",
    display: "fullscreen",
    orientation: "landscape",
    background_color: "#000000",
    theme_color: "#000000",
    start_url: location.href,
    icons: [{ src: iconUrl, sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]
  };
  const mLink = document.createElement('link');
  mLink.rel = 'manifest';
  mLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(mLink);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));`;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
})();

// 2. 合成音效与震动反馈
const AudioFx = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(freq, type, dur) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + dur);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + dur);
  },
  shoot() { this.play(420, 'square', 0.12); },
  boom() { this.play(150, 'sawtooth', 0.3); if (navigator.vibrate) navigator.vibrate(40); },
  hit() { this.play(260, 'triangle', 0.08); if (navigator.vibrate) navigator.vibrate(15); }
};

// 3. 游戏核心逻辑 (13x13 大格，细分为 26x26 小格，每小格 16px，总宽高 416px)
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const GRID = 26, TILE = 16;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 上 右 下 左

let map = []; // 0:空, 1:砖墙, 2:钢板, 9:基地
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let score = 0, lives = 3, enemyLeft = 20, spawnTimer = 0;
let running = false, paused = false;
let activeDir = -1, fireHeld = false;

// 经典对称关卡预设 (13x13)
const STAGE_1 = [
  "0000000000000",
  "0101010101010",
  "0101010101010",
  "0101012101010",
  "0101000001010",
  "0000010100000",
  "2011000001102",
  "0000012100000",
  "0101011101010",
  "0101010101010",
  "0101000001010",
  "0100000000010",
  "0000009000000"
];

function buildMap() {
  map = Array.from({length: GRID}, () => Array(GRID).fill(0));
  for (let r = 0; r < 13; r++) {
    for (let c = 0; c < 13; c++) {
      const ch = STAGE_1[r][c];
      const val = ch === '1' ? 1 : ch === '2' ? 2 : ch === '9' ? 9 : 0;
      map[r*2][c*2] = map[r*2+1][c*2] = map[r*2][c*2+1] = map[r*2+1][c*2+1] = val;
    }
  }
  // 基地外围护墙 (厚1小格的砖墙)
  const walls = [[23,11],[23,12],[23,13],[23,14],[24,11],[25,11],[24,14],[25,14]];
  walls.forEach(([r, c]) => map[r][c] = 1);
}

function createTank(x, y, isPlayer, type = 0) {
  return {
    x, y, w: 28, h: 28,
    dir: isPlayer ? 0 : 2,
    speed: isPlayer ? 2.2 : (type === 1 ? 2.6 : 1.5),
    isPlayer, type,
    cooldown: 0,
    hp: type === 2 ? 2 : 1
  };
}

function resetPlayer() {
  player = createTank(8 * TILE + 2, 24 * TILE + 2, true);
}

function initGame() {
  buildMap();
  score = 0; lives = 3; enemyLeft = 20;
  enemies = []; bullets = []; particles = [];
  resetPlayer();
  updateHUD();
  running = true; paused = false;
  document.getElementById('overlay').style.display = 'none';
}

function updateHUD() {
  document.getElementById('ui-enemy').textContent = enemyLeft + enemies.length;
  document.getElementById('ui-lives').textContent = lives;
  document.getElementById('ui-score').textContent = score;
}

function rectIntersect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function canMove(tank, nx, ny) {
  if (nx < 0 || ny < 0 || nx + tank.w > canvas.width || ny + tank.h > canvas.height) return false;
  const c1 = Math.floor(nx / TILE), c2 = Math.floor((nx + tank.w - 0.01) / TILE);
  const r1 = Math.floor(ny / TILE), r2 = Math.floor((ny + tank.h - 0.01) / TILE);
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (map[r][c] !== 0) return false;
    }
  }
  const testBox = {x: nx, y: ny, w: tank.w, h: tank.h};
  const allTanks = [player, ...enemies].filter(t => t && t !== tank);
  for (const other of allTanks) {
    if (rectIntersect(testBox, other)) return false;
  }
  return true;
}

function fire(tank) {
  if (tank.cooldown > 0) return;
  const [dx, dy] = DIRS[tank.dir];
  bullets.push({
    x: tank.x + tank.w / 2 - 3 + dx * 14,
    y: tank.y + tank.h / 2 - 3 + dy * 14,
    w: 6, h: 6,
    dx: dx * 5.5, dy: dy * 5.5,
    isPlayer: tank.isPlayer
  });
  tank.cooldown = tank.isPlayer ? 22 : 45;
  if (tank.isPlayer) AudioFx.shoot();
}

function addBoom(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 18, color
    });
  }
}

function gameOver(win) {
  running = false;
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = win ? "🎉 战役胜利！" : "💥 基地沦陷";
  document.getElementById('start-btn').textContent = "再来一局";
  ov.style.display = 'flex';
}

function update() {
  if (!running || paused) return;

  // 刷新敌军
  if (enemies.length < 4 && enemyLeft > 0) {
    spawnTimer++;
    if (spawnTimer > 70) {
      const spots = [0, 12 * TILE, 24 * TILE];
      const sx = spots[Math.floor(Math.random() * spots.length)] + 2;
      const temp = createTank(sx, 2, false, Math.floor(Math.random() * 3));
      if (canMove(temp, temp.x, temp.y)) {
        enemies.push(temp);
        enemyLeft--;
        spawnTimer = 0;
        updateHUD();
      }
    }
  }

  // 玩家控制
  if (player) {
    if (player.cooldown > 0) player.cooldown--;
    if (activeDir !== -1) {
      player.dir = activeDir;
      const [dx, dy] = DIRS[player.dir];
      const nx = player.x + dx * player.speed;
      const ny = player.y + dy * player.speed;
      if (canMove(player, nx, ny)) {
        player.x = nx; player.y = ny;
      } else {
        // 拐角自动对齐辅助，提升手机操控手感
        if (dx !== 0) player.y = Math.round(player.y / 8) * 8;
        if (dy !== 0) player.x = Math.round(player.x / 8) * 8;
      }
    }
    if (fireHeld) fire(player);
  }

  // 敌军 AI
  enemies.forEach(e => {
    if (e.cooldown > 0) e.cooldown--;
    const [dx, dy] = DIRS[e.dir];
    const nx = e.x + dx * e.speed, ny = e.y + dy * e.speed;
    if (canMove(e, nx, ny) && Math.random() > 0.015) {
      e.x = nx; e.y = ny;
    } else {
      // 优先朝向下方基地或玩家
      e.dir = Math.random() < 0.4 ? 2 : Math.floor(Math.random() * 4);
    }
    if (Math.random() < 0.04) fire(e);
  });

  // 子弹更新与碰撞
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.dx; b.y += b.dy;

    if (b.x < 0 || b.y < 0 || b.x > canvas.width || b.y > canvas.height) {
      bullets.splice(i, 1); continue;
    }

    // 地形碰撞
    const c1 = Math.floor(b.x / TILE), c2 = Math.floor((b.x + b.w) / TILE);
    const r1 = Math.floor(b.y / TILE), r2 = Math.floor((b.y + b.h) / TILE);
    let hitWall = false;
    for (let r = r1; r <= r2; r++) {
      for (let c = c1; c <= c2; c++) {
        if (r >= 0 && r < GRID && c >= 0 && c < GRID) {
          if (map[r][c] === 1) {
            map[r][c] = 0; hitWall = true;
            addBoom(c * TILE + 8, r * TILE + 8, '#d97706', 5);
          } else if (map[r][c] === 2) {
            hitWall = true;
            addBoom(b.x, b.y, '#e4e4e7', 4);
          } else if (map[r][c] === 9) {
            addBoom(13 * TILE, 25 * TILE, '#ef4444', 30);
            AudioFx.boom();
            gameOver(false);
            return;
          }
        }
      }
    }
    if (hitWall) {
      if (b.isPlayer) AudioFx.hit();
      bullets.splice(i, 1); continue;
    }

    // 击中敌我坦克
    if (b.isPlayer) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (rectIntersect(b, e)) {
          e.hp--;
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            addBoom(e.x + 14, e.y + 14, '#f59e0b', 16);
            AudioFx.boom();
            enemies.splice(j, 1);
            score += 100;
            updateHUD();
            if (enemies.length === 0 && enemyLeft === 0) gameOver(true);
          } else {
            AudioFx.hit();
          }
          break;
        }
      }
    } else if (player && rectIntersect(b, player)) {
      bullets.splice(i, 1);
      addBoom(player.x + 14, player.y + 14, '#ef4444', 20);
      AudioFx.boom();
      lives--;
      updateHUD();
      if (lives <= 0) {
        gameOver(false);
      } else {
        resetPlayer();
      }
    }
  }

  // 粒子动画
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawTank(t) {
  ctx.save();
  ctx.translate(t.x + t.w / 2, t.y + t.h / 2);
  ctx.rotate(t.dir * Math.PI / 2);
  const color = t.isPlayer ? '#f59e0b' : (t.type === 1 ? '#38bdf8' : t.type === 2 ? '#a3e635' : '#e4e4e7');
  ctx.fillStyle = color;
  // 左右履带
  ctx.fillRect(-13, -13, 6, 26);
  ctx.fillRect(7, -13, 6, 26);
  // 车体与炮塔
  ctx.fillRect(-8, -9, 16, 18);
  ctx.fillStyle = '#000';
  ctx.fillRect(-4, -4, 8, 8);
  // 炮管
  ctx.fillStyle = color;
  ctx.fillRect(-2, -15, 4, 12);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 绘制地图
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const v = map[r][c];
      if (v === 1) {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(c * TILE + 1, r * TILE + 1, TILE - 2, TILE - 2);
      } else if (v === 2) {
        ctx.fillStyle = '#d4d4d8';
        ctx.fillRect(c * TILE + 1, r * TILE + 1, TILE - 2, TILE - 2);
      }
    }
  }

  // 绘制基地图标 (位于底部中央 12,24 处，占 2x2 小格)
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(12 * TILE + 4, 24 * TILE + 4, 24, 24);
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(12 * TILE + 10, 24 * TILE + 10, 12, 12);

  if (player && running) drawTank(player);
  enemies.forEach(drawTank);

  ctx.fillStyle = '#fff';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 4. 多点触控与按键绑定
const dpad = document.getElementById('dpad');
const dBtns = document.querySelectorAll('.d-btn');

function handleDpadTouch(e) {
  e.preventDefault();
  let foundDir = -1;
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.classList.contains('d-btn')) {
      foundDir = parseInt(el.dataset.dir);
      break;
    }
  }
  activeDir = foundDir;
  dBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.dir) === activeDir));
}

dpad.addEventListener('touchstart', handleDpadTouch, {passive: false});
dpad.addEventListener('touchmove', handleDpadTouch, {passive: false});
dpad.addEventListener('touchend', handleDpadTouch, {passive: false});

const fireBtn = document.getElementById('btn-fire');
fireBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  fireHeld = true;
  fireBtn.classList.add('active');
  if (player && running && !paused) fire(player);
}, {passive: false});

fireBtn.addEventListener('touchend', e => {
  e.preventDefault();
  fireHeld = false;
  fireBtn.classList.remove('active');
}, {passive: false});

document.getElementById('start-btn').addEventListener('click', () => {
  AudioFx.init();
  initGame();
});

document.getElementById('btn-pause').addEventListener('click', e => {
  if (!running) return;
  paused = !paused;
  e.target.textContent = paused ? "继续" : "暂停";
});

document.getElementById('btn-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(()=>{});
    }
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});
</script>
</body>
</html>
