<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="极影播放器">
  <meta name="theme-color" content="#06070a">

  <title>极影 AI 播放器</title>

  <!-- 内联独立 PWA 应用清单配置 (Standalone 模式，启动自动隐藏网址栏并偏向横屏) -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E6%9E%81%E5%BD%B1AI%E6%92%AD%E6%94%BE%E5%99%A8%22%2C%22short_name%22%3A%22%E6%9E%81%E5%BD%B1%E6%92%AD%E6%94%BE%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22sensor_landscape%22%2C%22background_color%22%3A%22%2306070a%22%2C%22theme_color%22%3A%22%2306070a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%253E%253Crect%20width%3D'512'%20height%3D'512'%20rx%3D'120'%20fill%3D'%2523090a12'%2F%253E%253Cpath%20d%3D'M200%20160%20C200%20148%20213%20142%20223%20148%20L348%20244%20C357%20250%20357%20262%20348%20268%20L223%20364%20C213%20370%20200%20364%20200%20352%20Z'%20fill%3D'url(%2523glow)'%2F%253E%253Cpath%20d%3D'M165%20130%20C165%20142%20155%20152%20143%20152%20C155%20152%20165%20162%20165%20174%20C165%20162%20175%20152%20187%20152%20C175%20152%20165%20142%20165%20130%20Z'%20fill%3D'%252338bdf8'%2F%253E%253Cdefs%253E%253ClinearGradient%20id%3D'glow'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%253E%253Cstop%20offset%3D'0%2525'%20stop-color%3D'%252338bdf8'%2F%253E%253Cstop%20offset%3D'50%2525'%20stop-color%3D'%2523818cf8'%2F%253E%253Cstop%20offset%3D'100%2525'%20stop-color%3D'%2523c084fc'%2F%253E%253C%2FlinearGradient%253E%253C%2Fdefs%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <!-- 原生桌面高清图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090a12'/%3E%3Cpath d='M200 160 C200 148 213 142 223 148 L348 244 C357 250 357 262 348 268 L223 364 C213 370 200 364 200 352 Z' fill='url(%23g)'/%3E%3Cpath d='M165 130 C165 142 155 152 143 152 C155 152 165 162 165 174 C165 162 175 152 187 152 C175 152 165 142 165 130 Z' fill='%2338bdf8'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='50%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090a12'/%3E%3Cpath d='M200 160 C200 148 213 142 223 148 L348 244 C357 250 357 262 348 268 L223 364 C213 370 200 364 200 352 Z' fill='url(%23g)'/%3E%3Cpath d='M165 130 C165 142 155 152 143 152 C155 152 165 162 165 174 C165 162 175 152 187 152 C175 152 165 142 165 130 Z' fill='%2338bdf8'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='50%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --video-brightness: 1;
      --accent-color: #38bdf8;
      --panel-bg: rgba(14, 16, 26, 0.72);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    body, html {
      background-color: #06070a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0e111a 0%, #050608 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(var(--video-brightness));
      transition: filter 0.12s ease-out;
      background-color: #000;
    }

    /* AI 画质增强激活态：卷积微锐化 + 动态对比度 + 适度饱和重塑 */
    video.ai-enhanced {
      filter: url(#ai-sharpen) contrast(1.12) saturate(1.18) brightness(var(--video-brightness));
    }

    .center-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      background: rgba(15, 17, 28, 0.85);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 25;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.08);
      max-width: 90%;
      width: 360px;
      text-align: center;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .center-card.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.92);
      pointer-events: none;
    }

    .card-icon-halo {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
    }

    .card-icon-halo svg {
      width: 34px;
      height: 34px;
      stroke: #38bdf8;
      stroke-width: 1.8;
      fill: none;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .card-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
    }

    .btn-primary-glow {
      width: 100%;
      padding: 13px 20px;
      border-radius: 16px;
      border: none;
      outline: none;
      cursor: pointer;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-primary-glow:active {
      transform: scale(0.97);
      filter: brightness(1.1);
    }

    .btn-secondary-ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn-secondary-ghost:hover, .btn-secondary-ghost:active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .hud-feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(14, 16, 26, 0.88);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 18px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 45;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .hud-feedback.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .hud-icon svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hud-progress-wrap {
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .hud-progress-bar {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 2px;
    }

    .hud-text {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.95);
    }

    .drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 20, 0.88);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      border: 2px dashed rgba(56, 189, 248, 0.6);
      transition: opacity 0.2s ease;
    }

    .drop-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-tip {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(18, 20, 32, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 9px 20px;
      font-size: 13px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 60;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .toast-tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .controls-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      padding-top: max(20px, env(safe-area-inset-top));
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 20%, transparent 75%, rgba(0,0,0,0.65) 100%);
      opacity: 1;
      transition: opacity 0.32s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 30;
      pointer-events: none; /* 让空白处不挡住手势 */
    }

    .controls-overlay.hide {
      opacity: 0;
    }

    /* 内部实际交互卡片恢复 pointer-events */
    .controls-overlay * {
      pointer-events: auto;
    }

    /* 顶部通透微型浮岛 */
    .top-floating-island {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      padding: 8px 16px;
      border-radius: 20px;
      max-width: 65%;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .file-badge:active {
      background: rgba(25, 29, 44, 0.85);
    }

    .file-badge svg {
      width: 15px;
      height: 15px;
      stroke: var(--accent-color);
      flex-shrink: 0;
    }

    .video-title {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部通透主控胶囊 (Floating Capsule Dock) */
    .bottom-floating-dock {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      background: var(--panel-bg);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      padding: 14px 22px;
      box-shadow: var(--panel-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-bar-container {
      position: relative;
      width: 100%;
      height: 22px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      position: relative;
      transition: height 0.15s ease;
    }

    .progress-bar-container:hover .progress-bar-bg,
    .progress-bar-container:active .progress-bar-bg {
      height: 6px;
    }

    .progress-bar-current {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      position: relative;
    }

    .progress-dot {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 13px;
      height: 13px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      transition: transform 0.15s ease;
    }

    .progress-bar-container:hover .progress-dot,
    .progress-bar-container:active .progress-dot {
      transform: translateY(-50%) scale(1);
    }

    /* 宽裕呼吸感的按键排布 */
    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.88);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transition: background-color 0.2s ease, transform 0.15s ease, color 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .icon-btn:active {
      transform: scale(0.9);
      background-color: rgba(255, 255, 255, 0.16);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 醒目的核心播放按键 */
    .btn-play-hero {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .btn-play-hero:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* AI 画质增强激活胶囊态 */
    .ai-btn {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      width: 50px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ai-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.5);
      color: #fff;
    }

    .time-info {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      padding-left: 4px;
    }
  </style>
</head>
<body>

  <!-- AI 画质增强卷积微锐化矩阵算子 -->
  <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
    <filter id="ai-sharpen">
      <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.45 0  -0.45 2.8 -0.45  0 -0.45 0"/>
    </filter>
  </svg>

  <!-- 全局完全独立的文件选择器 (放置在最外层，确保任何浏览器沙箱均可直接唤醒系统弹窗) -->
  <input type="file" id="fileInput" accept="video/*,.mp4,.mkv,.mov,.webm,.avi" style="display: none;">

  <div class="player-container" id="player">
    <!-- 视频核心元素 (默认载入高品质演示，随时无感秒切本地) -->
    <video id="video" playsinline webkit-playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>

    <!-- 闲置/启动时的快捷中央导入卡片 (空灵高级感) -->
    <div class="center-card" id="centerCard">
      <div class="card-icon-halo">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
      </div>
      <div>
        <div class="card-title">极影 AI 播放器</div>
        <div class="card-desc" style="margin-top: 6px;">超清动态锐化 · 手势三向调控 · 极简原生</div>
      </div>
      <button class="btn-primary-glow" id="cardPickBtn">
        <svg style="width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>打开本地视频</span>
      </button>
      <button class="btn-secondary-ghost" id="cardDemoBtn">播放内置演示视频</button>
    </div>

    <!-- 拖拽文件进入播放器的遮罩提示 -->
    <div class="drop-overlay" id="dropOverlay">
      <svg style="width: 54px; height: 54px; stroke: #38bdf8; stroke-width: 1.8; fill: none;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      <span style="font-size: 14px; font-weight: 500; color: #fff;">释放文件立即硬件加速播放</span>
    </div>

    <!-- 极简 HUD 反馈指示器 (手势交互时秒级唤起) -->
    <div class="hud-feedback" id="hud">
      <div class="hud-icon" id="hudIcon"></div>
      <div class="hud-progress-wrap" id="hudProgressWrap">
        <div class="hud-progress-bar" id="hudProgressBar"></div>
      </div>
      <div class="hud-text" id="hudText"></div>
    </div>

    <!-- 顶部消息提示小胶囊 -->
    <div class="toast-tip" id="toastTip">
      <span id="toastMsg">欢迎使用极影 AI 播放器</span>
    </div>

    <div class="controls-overlay" id="controls">
      <!-- 顶部浮岛 -->
      <div class="top-floating-island">
        <div class="file-badge" id="topBadge" title="点击快速更换本地视频">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span class="video-title" id="videoTitle">BigBuckBunny.mp4</span>
        </div>

        <div style="display: flex; gap: 10px;">
          <!-- 演示源切换 -->
          <button class="icon-btn" id="demoCycleBtn" title="切换内置演示视频" aria-label="Cycle Sample">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
        </div>
      </div>

      <!-- 底部中控浮岛 (Floating Dock) -->
      <div class="bottom-floating-dock" id="bottomDock">
        <!-- 进度条 -->
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar-bg">
            <div class="progress-bar-current" id="progressBar">
              <div class="progress-dot"></div>
            </div>
          </div>
        </div>

        <div class="actions-bar">
          <div class="actions-group">
            <!-- 播放 / 暂停 -->
            <button class="icon-btn btn-play-hero" id="playBtn" aria-label="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon></svg>
            </button>

            <!-- 播放时间 -->
            <span class="time-info" id="timeDisplay">00:00 / 00:00</span>
          </div>

          <div class="actions-group">
            <!-- 本地文件选择按钮 (多通道触发，100% 呼出手机/电脑文件窗口) -->
            <button class="icon-btn" id="openLocalBtn" title="打开手机/电脑本地视频" aria-label="Open Local File">
              <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            </button>

            <!-- AI 动态画质增强开关 -->
            <button class="icon-btn ai-btn" id="aiBtn" title="AI 超分与边缘微锐化" aria-label="AI Enhancement">
              <svg viewBox="0 0 24 24">
                <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"></path>
                <path d="M19 15l1 2.2L22 18l-2 0.8L19 21l-0.8-2.2L16 18l2.2-0.8L19 15z"></path>
              </svg>
            </button>

            <!-- 横屏全屏切换 -->
            <button class="icon-btn" id="fullscreenBtn" title="全屏 / 锁定横屏" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const video = document.getElementById('video');
    const controls = document.getElementById('controls');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const aiBtn = document.getElementById('aiBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const videoTitle = document.getElementById('videoTitle');
    const fileInput = document.getElementById('fileInput');
    const openLocalBtn = document.getElementById('openLocalBtn');
    const topBadge = document.getElementById('topBadge');
    const dropOverlay = document.getElementById('dropOverlay');
    const demoCycleBtn = document.getElementById('demoCycleBtn');
    const toastTip = document.getElementById('toastTip');
    const toastMsg = document.getElementById('toastMsg');
    const centerCard = document.getElementById('centerCard');
    const cardPickBtn = document.getElementById('cardPickBtn');
    const cardDemoBtn = document.getElementById('cardDemoBtn');

    const hud = document.getElementById('hud');
    const hudIcon = document.getElementById('hudIcon');
    const hudProgressBar = document.getElementById('hudProgressBar');
    const hudProgressWrap = document.getElementById('hudProgressWrap');
    const hudText = document.getElementById('hudText');

    let brightness = 1.0;
    let hideControlsTimeout = null;
    let isAiEnhanced = false;
    let currentObjectUrl = null;

    const ICONS = {
      play: '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor"></polygon>',
      pause: '<rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect>',
      brightness: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>',
      volumeHigh: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07m3.54-10.61a9 9 0 0 1 0 14.14"></path>',
      volumeMute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
      forward: '<polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon>',
      backward: '<polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon>',
      speed: '<circle cx="12" cy="12" r="9"></circle><polyline points="12 6 12 12 16 14"></polyline>'
    };

    let toastTimer = null;
    function showToast(msg, duration = 2400) {
      toastMsg.textContent = msg;
      toastTip.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastTip.classList.remove('show'), duration);
    }

    // 安全载入并播放视频文件
    function loadVideoFile(file) {
      if (!file) return;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = URL.createObjectURL(file);
      video.src = currentObjectUrl;
      videoTitle.textContent = file.name;
      
      centerCard.classList.add('hidden');
      video.load();
      
      video.play().then(() => {
        playIcon.innerHTML = ICONS.pause;
        showToast(`正在播放: ${file.name}`);
      }).catch((err) => {
        playIcon.innerHTML = ICONS.play;
        showToast('视频已准备完毕，点击播放');
      });

      resetControlsTimer();
    }

    // 核心：无死角唤醒系统文件选择器（原生双引擎：File System Access API + input fallback）
    async function triggerSystemFilePicker() {
      // 方式 1: 优先尝试现代 Chromium / Edge / Android Chrome 的原生文件系统访问接口
      if (window.showOpenFilePicker) {
        try {
          const handles = await window.showOpenFilePicker({
            types: [{
              description: '本地视频文件',
              accept: {
                'video/*': ['.mp4', '.webm', '.ogg', '.mov', '.mkv', '.avi']
              }
            }],
            multiple: false
          });
          if (handles && handles.length > 0) {
            const file = await handles[0].getFile();
            loadVideoFile(file);
            return;
          }
        } catch (err) {
          // 用户主动点击取消时不降级，若是权限原因则平滑降级到传统 input
          if (err.name === 'AbortError') return;
        }
      }

      // 方式 2: 降级方案，直接模拟原生 input 触发
      fileInput.value = '';
      fileInput.click();
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        loadVideoFile(file);
      }
    });

    // 绑定多处打开入口
    openLocalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerSystemFilePicker();
    });

    topBadge.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerSystemFilePicker();
    });

    cardPickBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerSystemFilePicker();
    });

    cardDemoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      centerCard.classList.add('hidden');
      video.play();
      playIcon.innerHTML = ICONS.pause;
      resetControlsTimer();
    });

    // 拖拽文件进入播放器
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) {
        loadVideoFile(file);
      }
    });

    // 格式解码异常诊断
    video.addEventListener('error', () => {
      showToast('⚠️ 格式无法硬件解码。建议使用标准 MP4 (H.264/AAC) 或 WebM', 4000);
    });

    const DEMO_VIDEOS = [
      { name: "Big Buck Bunny (动画超分测试)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { name: "Elephants Dream (微光暗部测试)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
      { name: "For Bigger Blazes (风景色彩测试)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
    ];
    let demoIndex = 0;

    demoCycleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      demoIndex = (demoIndex + 1) % DEMO_VIDEOS.length;
      const demo = DEMO_VIDEOS[demoIndex];
      video.src = demo.url;
      videoTitle.textContent = demo.name;
      centerCard.classList.add('hidden');
      video.play();
      playIcon.innerHTML = ICONS.pause;
      showToast(`切换演示视频: ${demo.name}`);
      resetControlsTimer();
    });

    aiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isAiEnhanced = !isAiEnhanced;

      if (isAiEnhanced) {
        aiBtn.classList.add('active');
        video.classList.add('ai-enhanced');
        showHUD(
          `<svg viewBox="0 0 24 24">${ICONS.brightness}</svg>`,
          'AI 画质增强：已开启 (边缘超分微锐化)',
          null
        );
      } else {
        aiBtn.classList.remove('active');
        video.classList.remove('ai-enhanced');
        showHUD(
          `<svg viewBox="0 0 24 24">${ICONS.brightness}</svg>`,
          'AI 画质增强：已关闭',
          null
        );
      }
      resetControlsTimer();
    });

    function resetControlsTimer() {
      controls.classList.remove('hide');
      clearTimeout(hideControlsTimeout);
      if (!video.paused) {
        hideControlsTimeout = setTimeout(() => {
          controls.classList.add('hide');
        }, 3400);
      }
    }

    function togglePlay() {
      if (video.paused) {
        video.play();
        playIcon.innerHTML = ICONS.pause;
      } else {
        video.pause();
        playIcon.innerHTML = ICONS.play;
      }
      resetControlsTimer();
    }

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const percent = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${percent}%`;
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    progressContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = progressContainer.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (video.duration) {
        video.currentTime = pos * video.duration;
      }
      resetControlsTimer();
    });

    let hudTimeout = null;
    function showHUD(iconSvg, text, progressPercent = null) {
      hudIcon.innerHTML = iconSvg;
      hudText.textContent = text;

      if (progressPercent !== null) {
        hudProgressWrap.style.display = 'block';
        hudProgressBar.style.width = `${Math.min(Math.max(progressPercent, 0), 100)}%`;
      } else {
        hudProgressWrap.style.display = 'none';
      }

      hud.classList.add('show');
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        hud.classList.remove('show');
      }, 950);
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let gestureType = null;
    let startVolume = 1;
    let startBrightness = 1;
    let startCurrentTime = 0;
    let isSeeking = false;
    let seekTargetTime = 0;
    let lastTapTime = 0;
    let longPressTimer = null;
    let isSpeedingUp = false;

    // 阻止控制浮岛内部元素冒泡，防止手势误触发或拦截文件弹窗
    controls.addEventListener('touchstart', (e) => e.stopPropagation());
    controls.addEventListener('touchmove', (e) => e.stopPropagation());
    controls.addEventListener('touchend', (e) => e.stopPropagation());
    centerCard.addEventListener('touchstart', (e) => e.stopPropagation());
    centerCard.addEventListener('touchend', (e) => e.stopPropagation());

    player.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      gestureType = null;

      startVolume = video.volume;
      startBrightness = brightness;
      startCurrentTime = video.currentTime;
      isSeeking = false;

      // 长按 2.0x 倍速浏览
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (!gestureType && !video.paused) {
          isSpeedingUp = true;
          video.playbackRate = 2.0;
          showHUD(`<svg viewBox="0 0 24 24">${ICONS.speed}</svg>`, '2.0X 倍速快进中', null);
        }
      }, 450);
    }, { passive: true });

    player.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      const touch = e.touches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) > 12 || Math.abs(deltaY) > 12) {
        clearTimeout(longPressTimer);
      }

      // 手势方向初次判断
      if (!gestureType) {
        if (Math.abs(deltaX) > 16 && Math.abs(deltaX) > Math.abs(deltaY)) {
          gestureType = 'seek';
        } else if (Math.abs(deltaY) > 16) {
          gestureType = touchStartX < (window.innerWidth / 2) ? 'volume' : 'brightness';
        }
      }

      if (!gestureType) return;
      controls.classList.add('hide');

      // 1. 水平滑动：快退 / 快进
      if (gestureType === 'seek') {
        isSeeking = true;
        const seekRange = Math.min(180, video.duration || 100);
        const progressDelta = (deltaX / window.innerWidth) * seekRange;
        seekTargetTime = Math.max(0, Math.min(video.duration, startCurrentTime + progressDelta));
        const diff = Math.round(seekTargetTime - startCurrentTime);

        showHUD(
          `<svg viewBox="0 0 24 24">${diff >= 0 ? ICONS.forward : ICONS.backward}</svg>`,
          `${formatTime(seekTargetTime)} (${diff >= 0 ? '+' : ''}${diff}s)`,
          video.duration ? (seekTargetTime / video.duration) * 100 : 50
        );
      }
      // 2. 左半区上下滑：音量微调
      else if (gestureType === 'volume') {
        const volumeDelta = - (deltaY / (window.innerHeight * 0.7));
        const nextVolume = Math.max(0, Math.min(1, startVolume + volumeDelta));
        video.volume = nextVolume;

        showHUD(
          `<svg viewBox="0 0 24 24">${nextVolume === 0 ? ICONS.volumeMute : ICONS.volumeHigh}</svg>`,
          `音量 ${Math.round(nextVolume * 100)}%`,
          nextVolume * 100
        );
      }
      // 3. 右半区上下滑：硬件级屏幕亮度
      else if (gestureType === 'brightness') {
        const brightnessDelta = - (deltaY / (window.innerHeight * 0.7)) * 1.4;
        brightness = Math.max(0.2, Math.min(1.8, startBrightness + brightnessDelta));
        document.documentElement.style.setProperty('--video-brightness', brightness);

        const bPercent = Math.round(((brightness - 0.2) / 1.6) * 100);
        showHUD(
          `<svg viewBox="0 0 24 24">${ICONS.brightness}</svg>`,
          `亮度 ${bPercent}%`,
          bPercent
        );
      }
    }, { passive: true });

    player.addEventListener('touchend', (e) => {
      clearTimeout(longPressTimer);

      if (isSpeedingUp) {
        video.playbackRate = 1.0;
        isSpeedingUp = false;
      }

      if (gestureType === 'seek' && isSeeking && video.duration) {
        video.currentTime = seekTargetTime;
      }

      if (!gestureType) {
        const now = Date.now();
        if (now - lastTapTime < 280) {
          togglePlay();
        } else {
          if (controls.classList.contains('hide')) {
            resetControlsTimer();
          } else {
            controls.classList.add('hide');
          }
        }
        lastTapTime = now;
      } else {
        resetControlsTimer();
      }

      gestureType = null;
      isSeeking = false;
    });

    // 横屏全屏切换
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (player.requestFullscreen) {
            await player.requestFullscreen();
          } else if (player.webkitRequestFullscreen) {
            await player.webkitRequestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        }
      } catch (err) {
        if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      }
      resetControlsTimer();
    }

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });

    // 默认开启控制栏自动倒计时
    resetControlsTimer();
  </script>
</body>
</html>
