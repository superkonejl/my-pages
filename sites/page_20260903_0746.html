<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简时钟演示</title>
  <style>
    body {
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .clock {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #10b981;
    }
    .tag {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="clock" id="time">00:00:00</div>
  <div class="tag">我的第一个手机直出网页</div>
  <script>
    function tick() {
      const d = new Date();
      document.getElementById('time').innerText = d.toTimeString().split(' ')[0];
    }
    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
