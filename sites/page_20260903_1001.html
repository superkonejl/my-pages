<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>极简本地播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      will-change: filter;
    }

    /* 遮罩手势交互层 */
    #touch-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* 顶部控制栏 */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 20;
      transition: opacity 0.3s;
    }

    /* 底部控制栏 */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.3s;
    }

    .ui-hidden { opacity: 0; pointer-events: none; }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .btn:active { background: rgba(255, 255, 255, 0.3); }

    /* HUD 提示框 */
    #hud {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 20px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      display: none;
      z-index: 30;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    /* 进度条 */
    .progress-bar-container {
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      position: relative;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 13px;
    }

    /* 画质选择菜单 */
    #enhance-modal {
      position: absolute;
      bottom: 70px;
      right: 16px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
      width: 190px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-item {
      color: #ddd;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .modal-item.active {
      background: #2563eb;
      color: #fff;
      font-weight: bold;
    }

    #file-input { display: none; }
  </style>
</head>
<body>

<svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
  <filter id="adaptive-sharpen">
    <feConvolveMatrix id="kernel-matrix" order="3" preserveAlpha="true" kernelMatrix="0 -0.8 0 -0.8 4.2 -0.8 0 -0.8 0"/>
  </filter>
</svg>

<div id="player-container">
  <video id="video" playsinline webkit-playsinline></video>
  <div id="touch-layer"></div>

  <div id="hud">调节</div>

  <div class="top-bar" id="top-bar">
    <button class="btn" onclick="document.getElementById('file-input').click()">打开视频</button>
    <input type="file" id="file-input" accept="video/*">
    <div style="display:flex; gap:8px;">
      <button class="btn" id="enhance-btn">画质增强: 智能清晰</button>
      <button class="btn" id="fs-btn">横屏全屏</button>
    </div>
  </div>

  <div id="enhance-modal">
    <div class="modal-item" data-mode="off">原画输出 (关闭)</div>
    <div class="modal-item active" data-mode="smart">智能自适应锐化 (低清提质)</div>
    <div class="modal-item" data-mode="lowlight">暗部提亮与降噪 (夜晚/逆光)</div>
    <div class="modal-item" data-mode="anime">高轮廓动漫色彩 (线条重塑)</div>
    <div class="modal-item" data-mode="crisp">强力去雾超清 (超高对比)</div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <div class="progress-bar-container" id="progress-container">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="controls-row">
      <span id="time-display">00:00 / 00:00</span>
      <span style="font-size:11px; opacity:0.6;">左侧:音量 | 右侧:亮度 | 横滑:快进</span>
    </div>
  </div>
</div>

<script>
  // 注入 Web App Manifest，满足桌面添加要求
  const manifest = {
    name: "本地播放器",
    short_name: "播放器",
    start_url: window.location.href,
    display: "standalone",
    background_color: "#000000",
    theme_color: "#000000"
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  const video = document.getElementById('video');
  const touchLayer = document.getElementById('touch-layer');
  const hud = document.getElementById('hud');
  const topBar = document.getElementById('top-bar');
  const bottomBar = document.getElementById('bottom-bar');
  const progressFill = document.getElementById('progress-fill');
  const progressContainer = document.getElementById('progress-container');
  const timeDisplay = document.getElementById('time-display');
  const enhanceBtn = document.getElementById('enhance-btn');
  const enhanceModal = document.getElementById('enhance-modal');
  const kernelMatrix = document.getElementById('kernel-matrix');

  // 音频增益节点（支持声音突破 100%）
  let audioCtx, gainNode, sourceNode;
  let brightness = 1.0;
  let volume = 1.0;
  let isEnhanceOpen = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      sourceNode = audioCtx.createMediaElementSource(video);
      sourceNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }
  }

  // 1. 本地视频加载
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      initAudio();
      video.play();
    }
  });

  // 2. 自适应画质引擎
  const enhanceProfiles = {
    off: { filter: '', kernel: '0 0 0 0 1 0 0 0 0', label: '原画' },
    smart: { 
      filter: 'url(#adaptive-sharpen) contrast(1.08) saturate(1.05)', 
      kernel: '0 -0.6 0 -0.6 3.4 -0.6 0 -0.6 0',
      label: '智能锐化' 
    },
    lowlight: { 
      filter: 'brightness(1.2) contrast(1.15) saturate(1.1)', 
      kernel: '0 -0.4 0 -0.4 2.6 -0.4 0 -0.4 0',
      label: '暗部补偿' 
    },
    anime: { 
      filter: 'url(#adaptive-sharpen) contrast(1.25) saturate(1.3)', 
      kernel: '0 -1.2 0 -1.2 5.8 -1.2 0 -1.2 0',
      label: '动漫色彩' 
    },
    crisp: { 
      filter: 'url(#adaptive-sharpen) contrast(1.2) brightness(1.05)', 
      kernel: '-0.5 -0.5 -0.5 -0.5 5 -0.5 -0.5 -0.5 -0.5',
      label: '强力去雾' 
    }
  };

  let currentMode = 'smart';
  function applyEnhanceProfile(mode) {
    currentMode = mode;
    const profile = enhanceProfiles[mode];
    kernelMatrix.setAttribute('kernelMatrix', profile.kernel);
    updateVideoFilters();
    enhanceBtn.textContent = '画质: ' + profile.label;
  }

  function updateVideoFilters() {
    const profile = enhanceProfiles[currentMode];
    // 将亮度和画质增强滤镜动态合并
    video.style.filter = `${profile.filter} brightness(${brightness})`;
  }

  // 画质菜单交互
  enhanceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isEnhanceOpen = !isEnhanceOpen;
    enhanceModal.style.display = isEnhanceOpen ? 'flex' : 'none';
  });

  document.querySelectorAll('.modal-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.modal-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      applyEnhanceProfile(item.dataset.mode);
      enhanceModal.style.display = 'none';
      isEnhanceOpen = false;
    });
  });

  // 3. 手势控制交互
  let startX = 0, startY = 0;
  let gestureType = null; // 'seek' | 'volume' | 'brightness'
  let seekBaseTime = 0;
  let isTouching = false;
  let hideUITimer = null;

  function showHUD(text) {
    hud.textContent = text;
    hud.style.display = 'block';
  }

  function hideHUD() {
    hud.style.display = 'none';
  }

  function resetUITimer() {
    topBar.classList.remove('ui-hidden');
    bottomBar.classList.remove('ui-hidden');
    clearTimeout(hideUITimer);
    if (!video.paused) {
      hideUITimer = setTimeout(() => {
        topBar.classList.add('ui-hidden');
        bottomBar.classList.add('ui-hidden');
        enhanceModal.style.display = 'none';
        isEnhanceOpen = false;
      }, 3500);
    }
  }

  touchLayer.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    isTouching = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    gestureType = null;
    seekBaseTime = video.currentTime;
    initAudio();
  });

  touchLayer.addEventListener('touchmove', (e) => {
    if (!isTouching || e.touches.length !== 1) return;
    const deltaX = e.touches[0].clientX - startX;
    const deltaY = startY - e.touches[0].clientY; // 向上为正

    // 判定手势方向
    if (!gestureType) {
      if (Math.abs(deltaX) > 15 && Math.abs(deltaX) > Math.abs(deltaY)) {
        gestureType = 'seek';
      } else if (Math.abs(deltaY) > 15) {
        gestureType = startX < window.innerWidth / 2 ? 'volume' : 'brightness';
      }
    }

    if (gestureType === 'seek') {
      const seekOffset = (deltaX / window.innerWidth) * 90; // 最大滑动快进 90 秒
      const targetTime = Math.min(Math.max(0, seekBaseTime + seekOffset), video.duration || 0);
      video.currentTime = targetTime;
      const sign = seekOffset >= 0 ? '+' : '';
      showHUD(`快进/退: ${formatTime(targetTime)} (${sign}${Math.round(seekOffset)}s)`);
    } else if (gestureType === 'brightness') {
      brightness = Math.min(Math.max(0.2, brightness + deltaY * 0.002), 2.0);
      startY = e.touches[0].clientY; // 增量移动
      updateVideoFilters();
      showHUD(`模拟亮度: ${Math.round(brightness * 100)}%`);
    } else if (gestureType === 'volume') {
      volume = Math.min(Math.max(0, volume + deltaY * 0.003), 2.0);
      startY = e.touches[0].clientY;
      if (gainNode) gainNode.gain.value = volume;
      video.volume = Math.min(1.0, volume);
      showHUD(`音量: ${Math.round(volume * 100)}%`);
    }
  });

  touchLayer.addEventListener('touchend', (e) => {
    if (gestureType) {
      setTimeout(hideHUD, 500);
    } else {
      // 单击切换播放/暂停与显示UI
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
      resetUITimer();
    }
    isTouching = false;
    gestureType = null;
  });

  // 4. 进度条更新与跳转
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const percent = (video.currentTime / video.duration) * 100;
    progressFill.style.width = percent + '%';
    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    video.currentTime = pos * video.duration;
  });

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  // 5. 横屏全屏锁定
  document.getElementById('fs-btn').addEventListener('click', async () => {
    const container = document.getElementById('player-container');
    try {
      if (!document.fullscreenElement) {
        await container.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        await document.exitFullscreen();
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    } catch (err) {
      console.warn('全屏锁定不可用或被拦截:', err);
    }
  });

  // 默认应用智能锐化模式
  applyEnhanceProfile('smart');
</script>
</body>
</html>
