<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>极简影音</title>

    <!-- 动态 PWA Manifest (杜绝 404) -->
    <link rel="manifest" id="dynamic-manifest">

    <style>
        :root {
            --accent: #38bdf8;
            --glass: rgba(18, 18, 22, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 外部舞台 */
        .player-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            overflow: hidden;
        }

        /* 核心视口容器 (用于实现 90 度强制横屏旋转) */
        .rotatable-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), width 0.3s, height 0.3s;
            transform-origin: center center;
        }

        /* 强制 90° 横屏沉浸模式：宽高反转并顺时针转 90° */
        .player-stage.landscape-mode .rotatable-viewport {
            width: 100vh;
            height: 100vw;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
            transition: filter 0.2s ease, object-fit 0.2s ease;
        }

        video.fit-cover {
            object-fit: cover;
        }

        /* 纯清晰度增强滤镜：Sum 严格归一化为 1.0，绝不产生偏色与过饱和 */
        .clarity-lvl1 {
            filter: url(#sharp-lvl1);
        }
        .clarity-lvl2 {
            filter: url(#sharp-lvl2);
        }
        .clarity-lvl3 {
            filter: url(#sharp-lvl3);
        }

        /* 亮度控制遮罩 */
        .brightness-curtain {
            position: absolute;
            inset: 0;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* 极简磨砂 HUD 气泡 */
        .hud-bubble {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px 22px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #ffffff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 30;
        }

        .hud-bubble svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* 控制面板层 */
        .controls-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);
            z-index: 20;
            background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.75) 100%);
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .controls-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .top-row, .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 磨砂细线条图标按钮 */
        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            cursor: pointer;
        }

        .glass-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
        }

        .glass-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* 画质增强胶囊按键 */
        .clarity-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 14px;
            border-radius: 20px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: #e5e7eb;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .clarity-pill svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .clarity-pill.active {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        /* 锁屏按键 */
        .lock-btn.locked {
            color: #f59e0b;
            border-color: #f59e0b;
        }

        /* 底部控制布局 */
        .bottom-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-area {
            position: relative;
            width: 100%;
            height: 28px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .timeline-track {
            position: relative;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            overflow: hidden;
            transition: height 0.15s ease;
        }

        .timeline-area:active .timeline-track {
            height: 6px;
        }

        .timeline-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
        }

        .time-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            font-variant-numeric: tabular-nums;
        }

        .speed-btn {
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* 初始导入视频卡片 */
        .empty-curtain {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            z-index: 10;
        }

        .empty-curtain.hidden {
            display: none;
        }

        .upload-trigger {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 32px 42px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }

        .upload-trigger:active {
            transform: scale(0.96);
            border-color: var(--accent);
        }

        .upload-icon-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .upload-icon-circle svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
        }
    </style>
</head>
<body>

<!-- 纯清晰度定向锐化核：保持色彩平衡，消除低清模糊 -->
<svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <!-- 档位 1: 清晰 (精准 3x3 微轮廓反卷积) -->
    <filter id="sharp-lvl1" color-interpolation-filters="sRGB">
        <feConvolveMatrix order="3" preserveAlpha="true" edgeMode="duplicate" kernelMatrix="
             0   -1.2    0
            -1.2  5.8  -1.2
             0   -1.2    0
        "/>
    </filter>

    <!-- 档位 2: 超清 (5x5 广域高斯拉普拉斯核，专克低清视频拉大后的模糊，强力增强质感) -->
    <filter id="sharp-lvl2" color-interpolation-filters="sRGB">
        <feConvolveMatrix order="5" preserveAlpha="true" edgeMode="duplicate" kernelMatrix="
            -0.02 -0.05 -0.08 -0.05 -0.02
            -0.05 -0.15 -0.25 -0.15 -0.05
            -0.08 -0.25  3.40 -0.25 -0.08
            -0.05 -0.15 -0.25 -0.15 -0.05
            -0.02 -0.05 -0.08 -0.05 -0.02
        "/>
    </filter>

    <!-- 档位 3: 极清 (强力锐化，字幕、线条极致清晰) -->
    <filter id="sharp-lvl3" color-interpolation-filters="sRGB">
        <feConvolveMatrix order="3" preserveAlpha="true" edgeMode="duplicate" kernelMatrix="
            -0.8 -1.5 -0.8
            -1.5 10.2 -1.5
            -0.8 -1.5 -0.8
        "/>
    </filter>
</svg>

<div class="player-stage" id="stage">
    <!-- 旋转视口 -->
    <div class="rotatable-viewport" id="viewport">
        <video id="video" playsinline webkit-playsinline></video>
        <div class="brightness-curtain" id="brightnessCurtain"></div>

        <!-- 交互 HUD 指示器 -->
        <div class="hud-bubble" id="hud">
            <span id="hudIcon"></span>
            <span id="hudText"></span>
        </div>

        <!-- 原生文件选择器 -->
        <input type="file" id="realFileInput" accept="video/*,.mp4,.m4v,.mov,.mkv,.webm,.ts,.3gp" style="display: none;">

        <!-- 初始空状态 -->
        <div class="empty-curtain" id="emptyView">
            <label class="upload-trigger" for="realFileInput">
                <div class="upload-icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 4v16m-8-8h16"/></svg>
                </div>
                <span style="font-size: 0.95rem; color: #9ca3af;">选择本地视频</span>
            </label>
        </div>

        <!-- 浮层控制栏 -->
        <div class="controls-layer" id="controls">
            <div class="top-row">
                <label class="glass-btn" for="realFileInput" title="更换视频">
                    <svg viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                </label>

                <div class="action-cluster">
                    <!-- 画面比例：等比黑边 / 铺满全屏 -->
                    <button class="glass-btn" id="fitModeBtn" title="画面比例">
                        <svg id="fitIcon" viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    </button>

                    <!-- 画质增强（无偏色，纯清晰度拉升） -->
                    <div class="clarity-pill" id="clarityBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <span id="clarityLabel">画质增强</span>
                    </div>

                    <!-- 锁屏防触 -->
                    <button class="glass-btn lock-btn" id="lockBtn" title="锁定屏幕">
                        <svg id="lockIcon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    </button>

                    <!-- PWA 安装图标 -->
                    <button class="glass-btn" id="pwaInstallBtn" style="display: none;" title="安装应用">
                        <svg viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                </div>
            </div>

            <div class="bottom-wrap">
                <div class="timeline-area" id="progressArea">
                    <div class="timeline-track">
                        <div class="timeline-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="bottom-bar">
                    <button class="glass-btn" id="playBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>

                    <span class="time-label" id="timeLabel">00:00 / 00:00</span>

                    <div class="action-cluster">
                        <button class="glass-btn speed-btn" id="speedBtn">1.0x</button>

                        <!-- 强制 90° 横屏全屏切换按键 -->
                        <button class="glass-btn" id="rotateFullscreenBtn" title="横屏全屏">
                            <svg id="rotateIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* ==========================================================
 * 1. PWA 绝对路径与动态图标 (保证桌面安装不 404)
 * ========================================================== */
(function setupPWA() {
    function createIcon() {
        const cvs = document.createElement('canvas');
        cvs.width = 512;
        cvs.height = 512;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, 512, 512);

        const grad = ctx.createLinearGradient(100, 100, 412, 412);
        grad.addColorStop(0, '#38bdf8');
        grad.addColorStop(1, '#0284c7');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(256, 256, 170, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(225, 175);
        ctx.lineTo(330, 256);
        ctx.lineTo(225, 337);
        ctx.closePath();
        ctx.fill();
        return cvs.toDataURL('image/png');
    }

    const cleanUrl = window.location.origin + window.location.pathname;
    const manifest = {
        name: "极简影音",
        short_name: "播放器",
        start_url: cleanUrl,
        scope: "./",
        display: "standalone",
        orientation: "any",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [{ src: createIcon(), sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
})();

let deferredPrompt = null;
const pwaInstallBtn = document.getElementById('pwaInstallBtn');
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    pwaInstallBtn.style.display = 'inline-flex';
});
pwaInstallBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') pwaInstallBtn.style.display = 'none';
    deferredPrompt = null;
});

/* ==========================================================
 * 2. 视频装载与播放控制
 * ========================================================== */
const video = document.getElementById('video');
const realFileInput = document.getElementById('realFileInput');
const emptyView = document.getElementById('emptyView');
const timeLabel = document.getElementById('timeLabel');
const progressFill = document.getElementById('progressFill');
const progressArea = document.getElementById('progressArea');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');

realFileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (video.src) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(file);
    emptyView.classList.add('hidden');
    video.load();
    video.play().catch(() => updatePlayIcon(true));
    realFileInput.value = '';
    resetAutoFade();
});

function updatePlayIcon(isPaused) {
    playIcon.innerHTML = isPaused 
        ? '<polygon points="5 3 19 12 5 21 5 3"/>'
        : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
}

function togglePlayback() {
    if (video.paused) video.play();
    else video.pause();
}

playBtn.addEventListener('click', togglePlayback);
video.addEventListener('play', () => updatePlayIcon(false));
video.addEventListener('pause', () => updatePlayIcon(true));

function fmt(sec) {
    if (isNaN(sec) || !isFinite(sec)) return "00:00";
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    progressFill.style.width = `${(video.currentTime / video.duration) * 100}%`;
    timeLabel.innerText = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
});

progressArea.addEventListener('click', (e) => {
    const box = progressArea.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width));
    video.currentTime = ratio * video.duration;
});

// 倍速
const speedBtn = document.getElementById('speedBtn');
const speeds = [1.0, 1.25, 1.5, 2.0, 0.75];
let speedIdx = 0;
speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    video.playbackRate = speeds[speedIdx];
    speedBtn.innerText = `${speeds[speedIdx]}x`;
    showHUD('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', `${speeds[speedIdx]}x 倍速`);
});

/* ==========================================================
 * 3. 画面比例（适应 vs 铺满）
 * ========================================================== */
const fitModeBtn = document.getElementById('fitModeBtn');
let isCover = false;
fitModeBtn.addEventListener('click', () => {
    isCover = !isCover;
    video.classList.toggle('fit-cover', isCover);
    showHUD(
        '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
        isCover ? "画面：全屏铺满" : "画面：等比适应"
    );
});

/* ==========================================================
 * 4. 解决横屏核心：强制 90° 旋转全屏机制
 * ========================================================== */
const stage = document.getElementById('stage');
const rotateFullscreenBtn = document.getElementById('rotateFullscreenBtn');
const rotateIcon = document.getElementById('rotateIcon');
let isLandscape = false;

async function toggleLandscape() {
    isLandscape = !isLandscape;
    stage.classList.toggle('landscape-mode', isLandscape);

    if (isLandscape) {
        // 请求全屏隐藏状态栏
        if (stage.requestFullscreen) {
            stage.requestFullscreen().catch(() => {});
        } else if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
        // 图标切换为还原
        rotateIcon.innerHTML = '<path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M4 10h6m0 0V4m0 6L3 3m17 7h-6m0 0V4m0 6l7-7"/>';
        showHUD('<svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"/></svg>', "横屏沉浸已开启");
    } else {
        if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
        rotateIcon.innerHTML = '<path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>';
        showHUD('<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/></svg>', "竖屏模式");
    }
}

rotateFullscreenBtn.addEventListener('click', toggleLandscape);

/* ==========================================================
 * 5. 画质纯清晰度提升 (零色彩偏移)
 * ========================================================== */
const clarityBtn = document.getElementById('clarityBtn');
const clarityLabel = document.getElementById('clarityLabel');
let clarityLevel = 0; // 0: 原画, 1: 清晰, 2: 超清, 3: 极清

clarityBtn.addEventListener('click', () => {
    clarityLevel = (clarityLevel + 1) % 4;
    video.classList.remove('clarity-lvl1', 'clarity-lvl2', 'clarity-lvl3');
    clarityBtn.classList.remove('active');

    if (clarityLevel === 1) {
        video.classList.add('clarity-lvl1');
        clarityBtn.classList.add('active');
        clarityLabel.innerText = "清晰";
        showHUD('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>', "清晰度：清晰微锐化");
    } else if (clarityLevel === 2) {
        video.classList.add('clarity-lvl2');
        clarityBtn.classList.add('active');
        clarityLabel.innerText = "超清";
        showHUD('<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', "清晰度：超清质感 (广域细节)");
    } else if (clarityLevel === 3) {
        video.classList.add('clarity-lvl3');
        clarityBtn.classList.add('active');
        clarityLabel.innerText = "极清";
        showHUD('<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>', "清晰度：极清轮廓");
    } else {
        clarityLabel.innerText = "画质增强";
        showHUD('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>', "原画输出 (关闭增强)");
    }
});

/* ==========================================================
 * 6. 锁屏防触
 * ========================================================== */
const lockBtn = document.getElementById('lockBtn');
const lockIcon = document.getElementById('lockIcon');
let isLocked = false;

lockBtn.addEventListener('click', () => {
    isLocked = !isLocked;
    if (isLocked) {
        lockBtn.classList.add('locked');
        lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><circle cx="12" cy="16" r="1.5"/>';
        controls.classList.add('fade-out');
        showHUD('<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>', "已锁定防误触");
    } else {
        lockBtn.classList.remove('locked');
        lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>';
        controls.classList.remove('fade-out');
        resetAutoFade();
        showHUD('<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 019.9-1"/></svg>', "屏幕已解锁");
    }
});

/* ==========================================================
 * 7. 旋转自适应手势引擎 (横屏、竖屏无缝对应)
 * ========================================================== */
const controls = document.getElementById('controls');
const brightnessCurtain = document.getElementById('brightnessCurtain');
const hud = document.getElementById('hud');
const hudIcon = document.getElementById('hudIcon');
const hudText = document.getElementById('hudText');

let autoFadeTimer = null;
function resetAutoFade() {
    if (isLocked) return;
    controls.classList.remove('fade-out');
    clearTimeout(autoFadeTimer);
    if (!video.paused) {
        autoFadeTimer = setTimeout(() => controls.classList.add('fade-out'), 3200);
    }
}

let hudHideTimer = null;
function showHUD(svgHtml, txt) {
    hudIcon.innerHTML = svgHtml;
    hudText.innerText = txt;
    hud.style.opacity = '1';
    clearTimeout(hudHideTimer);
    hudHideTimer = setTimeout(() => hud.style.opacity = '0', 1100);
}

let startTouchX = 0, startTouchY = 0, startTime = 0;
let initialVol = 1, initialBright = 1, initialSeek = 0;
let activeGesture = null;
let lastTapStamp = 0;

stage.addEventListener('touchstart', (e) => {
    if (e.target.closest('button') || e.target.closest('.timeline-area') || e.target.closest('.upload-trigger') || e.target.closest('.clarity-pill')) {
        return;
    }

    if (isLocked) {
        if (e.target.closest('#lockBtn')) return;
        lockBtn.style.opacity = '1';
        setTimeout(() => { if (isLocked) lockBtn.style.opacity = '0.5'; }, 1500);
        return;
    }

    const t = e.touches[0];
    startTouchX = t.clientX;
    startTouchY = t.clientY;
    startTime = Date.now();
    activeGesture = null;
    initialVol = video.volume;
    initialSeek = video.currentTime;
    initialBright = 1 - parseFloat(brightnessCurtain.style.opacity || '0');
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
    if (isLocked || e.touches.length > 1 || !video.src) return;

    const t = e.touches[0];
    const rawDx = t.clientX - startTouchX;
    const rawDy = t.clientY - startTouchY;

    // 当 90 度横屏时，横握手机对应的视觉坐标自动转换
    let visualDx = rawDx;
    let visualDy = -rawDy; // 向上滑动为正

    if (isLandscape) {
        // 顺时针旋转 90 度后：屏幕 Y 对应横向 X，屏幕 -X 对应纵向 Y
        visualDx = rawDy;
        visualDy = -rawDx;
    }

    const absDx = Math.abs(visualDx);
    const absDy = Math.abs(visualDy);

    if (!activeGesture && (absDx > 14 || absDy > 14)) {
        if (absDx > absDy) {
            activeGesture = 'seek';
        } else {
            // 判断左侧还是右侧
            if (isLandscape) {
                activeGesture = (startTouchY < window.innerHeight / 2) ? 'brightness' : 'volume';
            } else {
                activeGesture = (startTouchX < window.innerWidth / 2) ? 'brightness' : 'volume';
            }
        }
    }

    if (activeGesture === 'brightness') {
        const delta = visualDy / (window.innerHeight * 0.6);
        const b = Math.min(Math.max(initialBright + delta, 0.1), 1.0);
        brightnessCurtain.style.opacity = (1 - b).toFixed(2);
        showHUD('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>', `${Math.round(b * 100)}%`);
    } else if (activeGesture === 'volume') {
        const delta = visualDy / (window.innerHeight * 0.6);
        const v = Math.min(Math.max(initialVol + delta, 0), 1);
        video.volume = v;
        showHUD('<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>', `${Math.round(v * 100)}%`);
    } else if (activeGesture === 'seek') {
        const span = (visualDx / (isLandscape ? window.innerHeight : window.innerWidth)) * 90;
        const target = Math.min(Math.max(initialSeek + span, 0), video.duration);
        video.currentTime = target;
        const sign = span >= 0 ? "+" : "";
        showHUD('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', `${fmt(target)} (${sign}${Math.round(span)}s)`);
    }
}, { passive: true });

stage.addEventListener('touchend', (e) => {
    if (isLocked) return;
    const now = Date.now();

    if (!activeGesture && (now - startTime) < 250) {
        // 双击判断
        if (now - lastTapStamp < 280) {
            clearTimeout(window.tapTimer);
            let isLeftSide = false;
            let isRightSide = false;

            if (isLandscape) {
                isLeftSide = startTouchY < window.innerHeight * 0.38;
                isRightSide = startTouchY > window.innerHeight * 0.62;
            } else {
                isLeftSide = startTouchX < window.innerWidth * 0.38;
                isRightSide = startTouchX > window.innerWidth * 0.62;
            }

            if (isLeftSide) {
                video.currentTime = Math.max(video.currentTime - 10, 0);
                showHUD('<svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>', "-10s");
            } else if (isRightSide) {
                video.currentTime = Math.min(video.currentTime + 10, video.duration);
                showHUD('<svg viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>', "+10s");
            } else {
                togglePlayback();
            }
            lastTapStamp = 0;
            return;
        }

        lastTapStamp = now;
        window.tapTimer = setTimeout(() => {
            if (controls.classList.contains('fade-out')) resetAutoFade();
            else controls.classList.add('fade-out');
        }, 260);
    } else {
        resetAutoFade();
    }
});
</script>
</body>
