<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 添加到主屏幕 / PWA 全屏沉浸式运行配置 -->
    <title>推拿客档</title>
    <meta name="application-name" content="推拿客档">
    <meta name="apple-mobile-web-app-title" content="推拿客档">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1115">

    <!-- 动态图标占位（在 JS 中通过高清矢量自动生成适配 iOS 与 Android 的高清图标） -->
    <link rel="icon" id="dynamic-favicon" type="image/svg+xml">
    <link rel="apple-touch-icon" id="dynamic-apple-icon">

    <style>
        :root {
            --bg-main: #0c0e12;
            --surface-card: #161920;
            --surface-card-hover: #1e222b;
            --surface-input: #101217;
            --border-subtle: #232833;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --primary-dark: #0284c7;
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #64748b;
            --danger: #f87171;
            --tag-bg: rgba(56, 189, 248, 0.12);
            --tag-text: #7dd3fc;
            --tag-border: rgba(56, 189, 248, 0.28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            padding: 16px 16px 96px 16px;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* 顶部导航与搜索 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(12, 14, 18, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 2px 10px 2px;
        }

        .app-branding {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: block;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-pill {
            font-size: 12px;
            font-weight: 500;
            background-color: var(--border-subtle);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .backup-btn {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .search-wrapper {
            position: relative;
            margin-top: 4px;
        }

        .search-input {
            width: 100%;
            height: 48px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-title);
            font-size: 16px;
            padding: 0 40px 0 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            display: none;
            padding: 4px;
            cursor: pointer;
        }

        /* 患者卡片列表 */
        .patient-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .patient-card {
            background: linear-gradient(145deg, var(--surface-card), #11141a);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .patient-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: 0.5px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
        }

        .card-actions button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .edit-action { color: var(--primary); }
        .del-action { color: var(--danger); opacity: 0.85; }

        .patient-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag-pill {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid var(--tag-border);
            font-size: 13px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 8px;
        }

        .patient-notes {
            font-size: 15px;
            color: #94a3b8;
            background-color: var(--surface-input);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 80px;
            font-size: 16px;
        }

        /* 右下角极简大加号悬浮按钮 (FAB) */
        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #041019;
            border: none;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            z-index: 50;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fab-btn:active {
            transform: scale(0.92);
        }

        /* 录入弹窗抽屉 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-body {
            width: 100%;
            background: #15181f;
            border-radius: 24px 24px 0 0;
            padding: 22px 18px 36px 18px;
            border-top: 1px solid var(--border-subtle);
            max-height: 88vh;
            overflow-y: auto;
            animation: slideUp 0.22s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-title);
        }

        .modal-close-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .form-item {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background-color: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-title);
            font-size: 17px;
            padding: 12px 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        textarea.form-control {
            height: 96px;
            resize: none;
            line-height: 1.5;
            font-size: 15px;
        }

        /* 分类特征池 */
        .trait-categories {
            background-color: var(--surface-input);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trait-group-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .select-chip {
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 8px;
            background-color: var(--surface-card);
            color: var(--text-body);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .select-chip.active {
            background-color: var(--primary);
            color: #041019;
            font-weight: 600;
            border-color: var(--primary);
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            flex: 1;
            height: 48px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-body);
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit {
            flex: 2;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #041019;
            font-weight: 700;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #backup-file-input { display: none; }
    </style>
</head>
<body>

    <!-- 顶部状态与检索 -->
    <header class="app-header">
        <div class="header-top">
            <div class="app-branding">
                <img id="header-logo-img" alt="Logo" class="header-logo">
                <div class="app-title">
                    推拿客档
                    <span id="record-count" class="count-pill">0 位</span>
                </div>
            </div>
            <button class="backup-btn" id="backup-btn">备份 / 数据</button>
        </div>
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="输入姓名 / 外貌特征 / 痛点备注检索..." autocomplete="off">
            <button id="search-clear" class="search-clear">&times;</button>
        </div>
    </header>

    <!-- 列表展示区 -->
    <main id="patient-list" class="patient-list"></main>
    <div id="empty-state" class="empty-state" style="display: none;">未查找到匹配的患者信息</div>

    <!-- 右下角悬浮添加按钮 (FAB) -->
    <button class="fab-btn" id="open-add-btn" aria-label="添加患者">+</button>

    <!-- 录入与编辑抽屉弹窗 -->
    <div class="modal" id="form-modal">
        <div class="modal-body">
            <div class="modal-header">
                <span class="modal-title" id="modal-title">新患者登记</span>
                <button class="modal-close-icon" id="modal-close-btn">&times;</button>
            </div>
            <form id="record-form">
                <input type="hidden" id="edit-id">

                <div class="form-item">
                    <label class="form-label" for="p-name">姓名 / 称呼 *</label>
                    <input type="text" id="p-name" class="form-control" placeholder="如：李哥、戴阿姨、3床张先生" required>
                </div>

                <div class="form-item">
                    <label class="form-label">体貌与问诊特征（点按快速多选）</label>
                    <div class="trait-categories">
                        <!-- 分类 1: 体貌体态 -->
                        <div>
                            <div class="trait-group-title">外貌与体型</div>
                            <div class="chip-container">
                                <span class="select-chip">戴黑框镜</span>
                                <span class="select-chip">戴金丝镜</span>
                                <span class="select-chip">短发干练</span>
                                <span class="select-chip">长发扎马尾</span>
                                <span class="select-chip">微胖体态</span>
                                <span class="select-chip">体型偏瘦</span>
                                <span class="select-chip">高个挺拔</span>
                                <span class="select-chip">白发多</span>
                            </div>
                        </div>

                        <!-- 分类 2: 职业与体态习惯 -->
                        <div>
                            <div class="trait-group-title">职业与体态习惯</div>
                            <div class="chip-container">
                                <span class="select-chip">久坐办公</span>
                                <span class="select-chip">长途司机</span>
                                <span class="select-chip">头前倾/探颈</span>
                                <span class="select-chip">富贵包/颈胸受限</span>
                                <span class="select-chip">圆肩驼背</span>
                                <span class="select-chip">重度低头族</span>
                                <span class="select-chip">常年伏案</span>
                                <span class="select-chip">健身爱好者</span>
                            </div>
                        </div>

                        <!-- 分类 3: 手法感受与偏好 -->
                        <div>
                            <div class="trait-group-title">手法偏好与体质</div>
                            <div class="chip-container">
                                <span class="select-chip">极度吃力</span>
                                <span class="select-chip">吃力偏重</span>
                                <span class="select-chip">不能吃力/怕痛</span>
                                <span class="select-chip">肌肉僵紧</span>
                                <span class="select-chip">畏风怕凉</span>
                                <span class="select-chip">喜慢揉松解</span>
                                <span class="select-chip">喜拔伸牵引</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label" for="p-custom-traits">其他补充特征（空格隔开）</label>
                    <input type="text" id="p-custom-traits" class="form-control" placeholder="如：说话慢 每次周六上午来">
                </div>

                <div class="form-item">
                    <label class="form-label" for="p-notes">重点部位 / 手法备注</label>
                    <textarea id="p-notes" class="form-control" placeholder="如：俯卧位颈肩松解为主，右肩胛提肌压痛明显，左侧风池穴避开重叩。"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btn-cancel">取消</button>
                    <button type="submit" class="btn-submit">保存录入</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 隐藏备份导入控件 -->
    <input type="file" id="backup-file-input" accept=".json">

    <script>
        // 1. 生成极简专业脊柱经络高清图腾 Logo (免外部依赖)
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
                <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#141922"/>
                    <stop offset="100%" stop-color="#0b0d11"/>
                </linearGradient>
                <radialGradient id="spineGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>
            <circle cx="256" cy="256" r="160" fill="url(#spineGlow)"/>
            <!-- 督脉中轴力线 -->
            <line x1="256" y1="125" x2="256" y2="385" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
            <!-- 脊椎与穴位节段 (C1-L5 意象) -->
            <rect x="204" y="135" width="104" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="256" cy="146" r="6" fill="#38bdf8"/>
            <circle cx="220" cy="146" r="3" fill="#7dd3fc"/>
            <circle cx="292" cy="146" r="3" fill="#7dd3fc"/>

            <rect x="188" y="185" width="136" height="25" rx="12.5" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="256" cy="197" r="7" fill="#38bdf8"/>
            <circle cx="206" cy="197" r="3.5" fill="#7dd3fc"/>
            <circle cx="306" cy="197" r="3.5" fill="#7dd3fc"/>

            <rect x="172" y="240" width="168" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="256" cy="254" r="8" fill="#38bdf8"/>
            <circle cx="192" cy="254" r="4" fill="#7dd3fc"/>
            <circle cx="320" cy="254" r="4" fill="#7dd3fc"/>

            <rect x="178" y="298" width="156" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="256" cy="311" r="7.5" fill="#38bdf8"/>
            <circle cx="198" cy="311" r="4" fill="#7dd3fc"/>
            <circle cx="314" cy="311" r="4" fill="#7dd3fc"/>

            <rect x="196" y="356" width="120" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="256" cy="368" r="6.5" fill="#38bdf8"/>
            <circle cx="212" cy="368" r="3" fill="#7dd3fc"/>
            <circle cx="300" cy="368" r="3" fill="#7dd3fc"/>
            <!-- 顶部高光大椎聚气点 -->
            <circle cx="256" cy="94" r="10" fill="#ffffff"/>
            <circle cx="256" cy="94" r="18" fill="#38bdf8" fill-opacity="0.35"/>
        </svg>`;

        const svgDataUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);

        // 设置动态 Favicon 与顶部图标
        document.getElementById('dynamic-favicon').href = svgDataUri;
        document.getElementById('header-logo-img').src = svgDataUri;

        // 离屏 Canvas 生成 PNG 供 iOS Safari 添加到主屏幕
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
            ctx.drawImage(img, 0, 0);
            const pngUri = canvas.toDataURL('image/png');
            document.getElementById('dynamic-apple-icon').href = pngUri;
            
            // 动态注入 Manifest 配置文件，确保 Android / 电脑浏览器能识别到桌面图标
            const manifestObj = {
                "name": "推拿客档与特征速记",
                "short_name": "推拿客档",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#0c0e12",
                "theme_color": "#0c0e12",
                "icons": [{ "src": pngUri, "sizes": "512x512", "type": "image/png" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(manifestLink);
        };
        img.src = svgDataUri;

        // 2. 数据层与交互逻辑
        const STORAGE_KEY = 'tcm_patient_quick_notes_v2';
        let patients = [];

        function init() {
            try {
                let data = localStorage.getItem(STORAGE_KEY);
                if (!data) data = localStorage.getItem('tcm_patient_quick_notes');
                patients = data ? JSON.parse(data) : [];
            } catch (e) {
                patients = [];
            }
            renderList();
            bindEvents();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('patient-list');
            const emptyEl = document.getElementById('empty-state');
            const query = document.getElementById('search-input').value.trim().toLowerCase();

            const filtered = patients.filter(item => {
                if (!query) return true;
                const matchName = item.name.toLowerCase().includes(query);
                const matchTraits = (item.traits || []).some(t => t.toLowerCase().includes(query));
                const matchNotes = (item.notes || '').toLowerCase().includes(query);
                return matchName || matchTraits || matchNotes;
            });

            document.getElementById('record-count').innerText = `${filtered.length} 位`;

            if (filtered.length === 0) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'block';
                return;
            }

            emptyEl.style.display = 'none';
            listEl.innerHTML = filtered.map(item => `
                <div class="patient-card">
                    <div class="card-header">
                        <div class="patient-name">${escapeHtml(item.name)}</div>
                        <div class="card-actions">
                            <button class="edit-action" onclick="openEditModal('${item.id}')">编辑</button>
                            <button class="del-action" onclick="deleteRecord('${item.id}')">删除</button>
                        </div>
                    </div>
                    ${item.traits && item.traits.length > 0 ? `
                        <div class="patient-tags">
                            ${item.traits.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}
                        </div>
                    ` : ''}
                    ${item.notes ? `
                        <div class="patient-notes">${escapeHtml(item.notes)}</div>
                    ` : ''}
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return (text || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = '新患者登记';
            document.getElementById('edit-id').value = '';
            document.getElementById('record-form').reset();
            document.querySelectorAll('.select-chip').forEach(el => el.classList.remove('active'));
            document.getElementById('form-modal').classList.add('active');
            setTimeout(() => document.getElementById('p-name').focus(), 120);
        }

        window.openEditModal = function(id) {
            const item = patients.find(p => p.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = '修改患者信息';
            document.getElementById('edit-id').value = item.id;
            document.getElementById('p-name').value = item.name;
            document.getElementById('p-notes').value = item.notes || '';

            const currentTraits = item.traits || [];
            const remainingCustom = [];

            document.querySelectorAll('.select-chip').forEach(chip => {
                const text = chip.innerText.trim();
                if (currentTraits.includes(text)) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            const allPresetTexts = Array.from(document.querySelectorAll('.select-chip')).map(el => el.innerText.trim());
            currentTraits.forEach(t => {
                if (!allPresetTexts.includes(t)) remainingCustom.push(t);
            });

            document.getElementById('p-custom-traits').value = remainingCustom.join(' ');
            document.getElementById('form-modal').classList.add('active');
        };

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        window.deleteRecord = function(id) {
            if (confirm('确定要删除这位患者的记录吗？')) {
                patients = patients.filter(p => p.id !== id);
                saveData();
            }
        };

        function bindEvents() {
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');

            searchInput.addEventListener('input', () => {
                searchClear.style.display = searchInput.value ? 'block' : 'none';
                renderList();
            });

            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchClear.style.display = 'none';
                searchInput.focus();
                renderList();
            });

            document.getElementById('open-add-btn').addEventListener('click', openAddModal);
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('btn-cancel').addEventListener('click', closeModal);

            document.getElementById('form-modal').addEventListener('click', (e) => {
                if (e.target.id === 'form-modal') closeModal();
            });

            document.querySelectorAll('.select-chip').forEach(chip => {
                chip.addEventListener('click', () => chip.classList.toggle('active'));
            });

            document.getElementById('record-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('edit-id').value;
                const name = document.getElementById('p-name').value.trim();
                const notes = document.getElementById('p-notes').value.trim();

                const selectedChips = Array.from(document.querySelectorAll('.select-chip.active')).map(el => el.innerText.trim());
                const customInput = document.getElementById('p-custom-traits').value.trim();
                const customTraits = customInput ? customInput.split(/[\s,，]+/).filter(Boolean) : [];
                const traits = Array.from(new Set([...selectedChips, ...customTraits]));

                if (id) {
                    const idx = patients.findIndex(p => p.id === id);
                    if (idx !== -1) {
                        patients[idx] = { ...patients[idx], name, traits, notes, updatedAt: Date.now() };
                    }
                } else {
                    patients.unshift({
                        id: 'p_' + Date.now(),
                        name,
                        traits,
                        notes,
                        updatedAt: Date.now()
                    });
                }

                saveData();
                closeModal();
            });

            document.getElementById('backup-btn').addEventListener('click', () => {
                const isExport = confirm('【患者数据备份】\n\n- 点【确定】：将数据导出为 JSON 文件到手机\n- 点【取消】：从备份文件导入恢复数据');
                if (isExport) {
                    exportData();
                } else {
                    document.getElementById('backup-file-input').click();
                }
            });

            document.getElementById('backup-file-input').addEventListener('change', importData);
        }

        function exportData() {
            if (patients.length === 0) {
                alert('暂无患者数据可备份');
                return;
            }
            const blob = new Blob([JSON.stringify(patients, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `推拿客档备份_${dateStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`解析成功，共发现 ${imported.length} 条记录。确定导入覆盖吗？`)) {
                            patients = imported;
                            saveData();
                            alert('导入完成！');
                        }
                    } else {
                        alert('文件格式不规范，请选择导出的备份文件。');
                    }
                } catch (err) {
                    alert('导入失败，无法解析文件内容。');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        init();
    </script>
</body>
</html>
