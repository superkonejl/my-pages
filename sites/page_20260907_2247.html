<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>极简速记 PWA</title>

    <!-- PWA Manifest 动态占位符 -->
    <link rel="manifest" id="dynamic-manifest">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2d2d2d;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-active: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            font-size: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 顶部导航与状态栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* 安装按钮 */
        .btn-install {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: 1px solid #3b82f6;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-install:active {
            transform: scale(0.96);
        }

        /* 录入区 */
        .input-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 1.05rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .btn-add:active {
            background-color: var(--accent-active);
        }

        /* 记录列表 */
        .list-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 0 4px;
        }

        .memo-item {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .memo-content {
            font-size: 1.05rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .memo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid #282828;
            padding-top: 8px;
        }

        .memo-actions {
            display: flex;
            gap: 12px;
        }

        .action-text {
            cursor: pointer;
            color: var(--text-secondary);
        }

        .action-text.delete:hover {
            color: var(--danger);
        }

        .empty-hint {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>极简速记</h1>
        <button id="installBtn" class="btn-install">
            <span>⬇</span> 安装到桌面
        </button>
    </header>

    <div class="input-card">
        <textarea id="memoInput" placeholder="写点什么...支持换行，自动保存在本地"></textarea>
        <div class="action-bar">
            <button id="addBtn" class="btn-add">保存记录</button>
        </div>
    </div>

    <div class="list-section">
        <div class="list-header">
            <span id="countText">全部记录 (0)</span>
            <span id="clearAllBtn" class="action-text">清空全部</span>
        </div>
        <div id="memoList"></div>
    </div>
</div>

<script>
    /* ==========================================
     * 1. 动态生成 PWA Manifest (解决 404 核心逻辑)
     * ========================================== */
    (function initPWA() {
        // 创建内置高清图标 (192x192 & 512x512)，无需外链图片文件
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // 背景底色
            ctx.fillStyle = '#1e1e1e';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.22);
            ctx.fill();

            // 边框
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = size * 0.04;
            ctx.stroke();

            // 图标主体（蓝白简易笔刷图案）
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(size * 0.28, size * 0.25, size * 0.44, size * 0.1);
            ctx.fillRect(size * 0.28, size * 0.45, size * 0.44, size * 0.1);
            ctx.fillRect(size * 0.28, size * 0.65, size * 0.28, size * 0.1);

            return canvas.toDataURL('image/png');
        }

        const icon192 = createIcon(192);
        const icon512 = createIcon(512);

        // 关键点：剔除 URL 后的 hash 与 search，确保精准定位到本页面当前 URL
        const currentCleanUrl = window.location.origin + window.location.pathname;

        const manifestData = {
            "name": "极简速记",
            "short_name": "速记",
            "description": "本地离线可用的极简备忘录",
            "start_url": currentCleanUrl, // 关键：绝对当前页面路径，杜绝 GitHub Pages 根目录 404
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#121212",
            "theme_color": "#121212",
            "icons": [
                {
                    "src": icon192,
                    "sizes": "192x192",
                    "type": "image/png",
                    "purpose": "any maskable"
                },
                {
                    "src": icon512,
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(blob);
        document.getElementById('dynamic-manifest').setAttribute('href', manifestURL);
    })();

    /* ==========================================
     * 2. 安装到桌面 (beforeinstallprompt 事件捕获)
     * ========================================== */
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // 阻止默认自动弹窗，交由按键触发
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        } else {
            // 已安装或浏览器未触发 prompt 时的操作提示
            alert('如未弹出安装窗口，请点击浏览器右上角【⋮】菜单，选择【安装应用】或【添加到主屏幕】。');
        }
    });

    window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
    });

    // 如果已经是 Standalone 独立应用模式打开，隐藏安装按钮
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        installBtn.style.display = 'none';
    }

    /* ==========================================
     * 3. 业务逻辑 (本地缓存记事)
     * ========================================== */
    const memoInput = document.getElementById('memoInput');
    const addBtn = document.getElementById('addBtn');
    const memoList = document.getElementById('memoList');
    const countText = document.getElementById('countText');
    const clearAllBtn = document.getElementById('clearAllBtn');

    const STORAGE_KEY = 'minimal_pwa_memo_data';

    function getMemos() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveMemos(memos) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
        render();
    }

    function formatDate(ts) {
        const d = new Date(ts);
        const m = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        const h = d.getHours().toString().padStart(2, '0');
        const min = d.getMinutes().toString().padStart(2, '0');
        return `${m}-${day} ${h}:${min}`;
    }

    function render() {
        const memos = getMemos();
        countText.innerText = `全部记录 (${memos.length})`;
        memoList.innerHTML = '';

        if (memos.length === 0) {
            memoList.innerHTML = '<div class="empty-hint">暂无记录，输入内容点击保存即可。</div>';
            return;
        }

        memos.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'memo-item';

            card.innerHTML = `
                <div class="memo-content">${escapeHtml(item.text)}</div>
                <div class="memo-footer">
                    <span>${formatDate(item.timestamp)}</span>
                    <div class="memo-actions">
                        <span class="action-text" onclick="copyMemo(${index})">复制</span>
                        <span class="action-text delete" onclick="deleteMemo(${index})">删除</span>
                    </div>
                </div>
            `;
            memoList.appendChild(card);
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    addBtn.addEventListener('click', () => {
        const text = memoInput.value.trim();
        if (!text) return;

        const memos = getMemos();
        memos.unshift({
            text: text,
            timestamp: Date.now()
        });
        saveMemos(memos);
        memoInput.value = '';
    });

    window.deleteMemo = function(index) {
        const memos = getMemos();
        memos.splice(index, 1);
        saveMemos(memos);
    };

    window.copyMemo = function(index) {
        const memos = getMemos();
        if (memos[index]) {
            navigator.clipboard.writeText(memos[index].text).then(() => {
                alert('已复制到剪贴板');
            });
        }
    };

    clearAllBtn.addEventListener('click', () => {
        const memos = getMemos();
        if (memos.length === 0) return;
        if (confirm('确定要清空所有记录吗？')) {
            saveMemos([]);
        }
    });

    // 初始渲染
    render();
</script>
</body>
</html>
