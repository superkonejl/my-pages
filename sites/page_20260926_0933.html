<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>胶片 · 本地视频播放器</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --panel:#17161a; --panel2:#1f1e23; --text:#f2ede3;
  --dim:#8c8891; --accent:#e8ab49; --accent-dim:#3a2f1c;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; background:var(--bg); overscroll-behavior:none;}
body{font-family:'Space Grotesk',system-ui,sans-serif; color:var(--text); overflow:hidden;}
.mono{font-family:'JetBrains Mono',monospace;}

#app{position:fixed; inset:0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}

/* --- 空状态 / 选择文件 --- */
#dropzone{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:24px; text-align:center;
}
.reel{width:76px; height:76px; opacity:.9;}
#dropzone h1{font-size:1.25rem; font-weight:600; margin:0; letter-spacing:.2px;}
#dropzone p{color:var(--dim); font-size:.92rem; margin:0; max-width:280px; line-height:1.5;}
#pickBtn{
  margin-top:8px; background:var(--accent); color:#141008; border:none; border-radius:999px;
  padding:13px 28px; font-family:inherit; font-weight:600; font-size:.95rem; letter-spacing:.2px;
  display:inline-block; cursor:pointer;
}
#installHint{margin-top:26px; color:var(--dim); font-size:.78rem; max-width:260px; line-height:1.6;}
#installBtn{
  margin-top:10px; background:none; border:1px solid #333038; color:var(--text);
  border-radius:999px; padding:8px 18px; font-family:inherit; font-size:.82rem;
}

/* --- 播放器 --- */
#player{position:absolute; inset:0; background:#000; display:none;}
#stage{position:absolute; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center;}
video{max-width:100%; max-height:100%; touch-action:none; transition:filter .15s linear;}
.gesture-layer{position:absolute; inset:0;}

/* 中央大播放键 */
#bigPlay{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:66px; height:66px; border-radius:50%; background:rgba(20,18,14,.55);
  backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
  transition:opacity .2s;
}
#bigPlay svg{width:26px; height:26px; fill:var(--text); margin-left:3px;}

/* 手势反馈 */
#feedback{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(20,18,14,.7); backdrop-filter:blur(8px); border-radius:16px;
  padding:14px 20px; display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none;
  transition:opacity .15s; font-size:1rem; font-weight:600;
}
#feedback svg{width:20px; height:20px; fill:var(--text); flex-shrink:0;}
.bar-track{width:70px; height:4px; background:#4a4650; border-radius:2px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:2px;}

/* 顶部/底部控制条 */
#topBar,#bottomBar{
  position:absolute; left:0; right:0; display:flex; align-items:center; gap:14px;
  padding:0 16px; transition:opacity .25s, transform .25s; z-index:5;
}
#topBar{top:0; padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:14px;
  background:linear-gradient(rgba(0,0,0,.55),transparent); justify-content:space-between;}
#bottomBar{bottom:0; flex-direction:column; gap:8px; padding-top:24px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.65));}
.hidden-ui #topBar{opacity:0; transform:translateY(-8px); pointer-events:none;}
.hidden-ui #bottomBar{opacity:0; transform:translateY(8px); pointer-events:none;}

#fileName{font-size:.82rem; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56vw;}
.iconBtn{background:none; border:none; padding:6px; display:flex; align-items:center; justify-content:center;}
.iconBtn svg{width:21px; height:21px; fill:var(--text);}

.progressRow{width:100%; display:flex; align-items:center; gap:10px;}
.time{font-size:.74rem; color:var(--dim); width:42px; flex-shrink:0;}
.time.right{text-align:right;}
#seek{-webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:2px;
  background:linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct,0%), #4a4650 var(--pct,0%), #4a4650 100%);
  outline:none;}
#seek::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent);}
.ctrlRow{display:flex; align-items:center; justify-content:space-between; width:100%;}
.ctrlLeft{display:flex; align-items:center; gap:4px;}

/* 增强面板 */
#enhancePanel{
  position:absolute; right:12px; bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:6;
  width:230px; background:var(--panel); border:1px solid #2a2830; border-radius:16px; padding:16px;
  display:none; box-shadow:0 12px 30px rgba(0,0,0,.5);
}
#enhancePanel h3{margin:0 0 12px; font-size:.88rem; display:flex; align-items:center; justify-content:space-between;}
.switch{position:relative; width:36px; height:20px; border-radius:10px; background:#4a4650; flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s;}
.switch.on::after{transform:translateX(16px);}
.sliderRow{margin-bottom:12px;}
.sliderRow label{display:flex; justify-content:space-between; font-size:.72rem; color:var(--dim); margin-bottom:5px;}
.sliderRow input[type=range]{-webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:#3a3740; outline:none;}
.sliderRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent);}
.presetRow{display:flex; gap:6px; margin-top:2px;}
.presetBtn{flex:1; background:var(--panel2); border:1px solid #2f2d35; color:var(--text); border-radius:8px; padding:7px 0; font-size:.68rem; font-family:inherit;}
.presetBtn.active{border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div id="app">

  <div id="dropzone">
    <svg class="reel" viewBox="0 0 100 100" fill="none" stroke="#e8ab49" stroke-width="4">
      <circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="9" fill="#e8ab49" stroke="none"/>
      <circle cx="50" cy="22" r="7"/><circle cx="74" cy="38" r="7"/><circle cx="65" cy="66" r="7"/>
      <circle cx="35" cy="66" r="7"/><circle cx="26" cy="38" r="7"/>
    </svg>
    <h1>本地视频播放器</h1>
    <p>选择设备上的视频文件，支持手势操作、全屏播放与实时画质增强，全程本地处理，不会上传</p>
    <label for="fileInput" id="pickBtn">选择视频文件</label>
    <input type="file" id="fileInput" accept="video/*" hidden>
    <div id="installHint">iPhone：点击底部分享按钮 → “添加到主屏幕”，即可像 App 一样打开</div>
    <button id="installBtn" style="display:none;">添加到桌面</button>
  </div>

  <div id="player">
    <svg width="0" height="0" style="position:absolute">
      <filter id="sharpenFilter">
        <feConvolveMatrix id="sharpenMatrix" order="3" preserveAlpha="true"
          kernelMatrix="0 0 0 0 1 0 0 0 0"/>
      </filter>
    </svg>
    <div id="stage">
      <video id="video" playsinline webkit-playsinline></video>
    </div>
    <div class="gesture-layer" id="gesture"></div>
    <div id="bigPlay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div id="feedback"></div>

    <div id="topBar">
      <button class="iconBtn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
      <div id="fileName" class="mono">未命名</div>
      <button class="iconBtn" id="enhanceBtn"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></button>
    </div>

    <div id="bottomBar">
      <div class="progressRow">
        <span class="time mono" id="curTime">00:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        <span class="time mono right" id="durTime">00:00</span>
      </div>
      <div class="ctrlRow">
        <div class="ctrlLeft">
          <button class="iconBtn" id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="iconBtn" id="backTen"><svg viewBox="0 0 24 24"><path d="M11 5V1L6 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H3c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg></button>
          <button class="iconBtn" id="fwdTen"><svg viewBox="0 0 24 24"><path d="M13 5V1l5 5-5 5V7c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg></button>
        </div>
        <button class="iconBtn" id="fsBtn"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
      </div>
    </div>

    <div id="enhancePanel">
      <h3>画质增强 <div class="switch" id="enhSwitch"></div></h3>
      <div class="presetRow" style="margin-bottom:14px;">
        <button class="presetBtn active" data-preset="off">原始</button>
        <button class="presetBtn" data-preset="soft">柔和</button>
        <button class="presetBtn" data-preset="sharp">锐化</button>
        <button class="presetBtn" data-preset="vivid">鲜明</button>
      </div>
      <div class="sliderRow"><label><span>锐化强度</span><span id="vSharp">0</span></label>
        <input type="range" id="rSharp" min="0" max="100" value="0"></div>
      <div class="sliderRow"><label><span>对比度</span><span id="vContrast">100%</span></label>
        <input type="range" id="rContrast" min="60" max="160" value="100"></div>
      <div class="sliderRow"><label><span>饱和度</span><span id="vSat">100%</span></label>
        <input type="range" id="rSat" min="40" max="200" value="100"></div>
      <div class="sliderRow" style="margin-bottom:0;"><label><span>亮度</span><span id="vBright">100%</span></label>
        <input type="range" id="rBright" min="50" max="160" value="100"></div>
    </div>
  </div>
</div>

<script>
// ---------- PWA: 动态图标 + manifest（失败也不影响下方播放逻辑） ----------
try{
  const c=document.createElement('canvas'); c.width=192; c.height=192;
  const g=c.getContext('2d');
  g.fillStyle='#0b0b0d'; g.fillRect(0,0,192,192);
  g.strokeStyle='#e8ab49'; g.lineWidth=9; g.beginPath(); g.arc(96,96,72,0,7); g.stroke();
  g.fillStyle='#e8ab49'; g.beginPath(); g.moveTo(78,60); g.lineTo(78,132); g.lineTo(134,96); g.closePath(); g.fill();
  const icon=c.toDataURL('image/png');
  [['icon',null],['apple-touch-icon',null]].forEach(([rel])=>{
    const l=document.createElement('link'); l.rel=rel; l.href=icon; document.head.appendChild(l);
  });
  const manifest={name:'本地视频播放器',short_name:'视频播放器',start_url:'.',display:'standalone',
    background_color:'#0b0b0d',theme_color:'#0b0b0d',icons:[{src:icon,sizes:'192x192',type:'image/png'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const ml=document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(blob);
  document.head.appendChild(ml);
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferredPrompt=e;
    const btn=document.getElementById('installBtn'); btn.style.display='inline-block';
    btn.onclick=()=>{deferredPrompt.prompt();};
  });
}catch(err){ console.warn('PWA 图标/manifest 生成失败，不影响播放功能', err); }

// ---------- 选择文件 ----------
const fileInput=document.getElementById('fileInput');
const video=document.getElementById('video');
fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0]; if(!f) return;
  video.src=URL.createObjectURL(f);
  document.getElementById('fileName').textContent=f.name;
  document.getElementById('dropzone').style.display='none';
  document.getElementById('player').style.display='block';
  video.play();
});
document.getElementById('backBtn').onclick=()=>{
  video.pause(); video.removeAttribute('src'); video.load();
  document.getElementById('player').style.display='none';
  document.getElementById('dropzone').style.display='flex';
};

// ---------- 播放控制 ----------
const playBtn=document.getElementById('playBtn'), bigPlay=document.getElementById('bigPlay');
const seek=document.getElementById('seek'), curTime=document.getElementById('curTime'), durTime=document.getElementById('durTime');
function fmt(s){ if(!isFinite(s)) return '00:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
function svgPlay(){return '<path d="M8 5v14l11-7z"/>';}
function svgPause(){return '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';}
function updatePlayIcon(){ const p=video.paused; playBtn.querySelector('svg').innerHTML=p?svgPlay():svgPause(); bigPlay.style.display=p?'flex':'none'; }
function togglePlay(){ video.paused? video.play():video.pause(); }
playBtn.onclick=togglePlay; bigPlay.onclick=togglePlay;
video.addEventListener('play',updatePlayIcon); video.addEventListener('pause',updatePlayIcon);
video.addEventListener('loadedmetadata',()=>{ seek.max=video.duration; durTime.textContent=fmt(video.duration); updatePlayIcon(); });
video.addEventListener('timeupdate',()=>{
  if(!seekDragging){ seek.value=video.currentTime; }
  curTime.textContent=fmt(video.currentTime);
  seek.style.setProperty('--pct',(video.currentTime/video.duration*100||0)+'%');
});
let seekDragging=false;
seek.addEventListener('input',()=>{ seekDragging=true; curTime.textContent=fmt(seek.value); seek.style.setProperty('--pct',(seek.value/video.duration*100||0)+'%'); });
seek.addEventListener('change',()=>{ video.currentTime=seek.value; seekDragging=false; });
document.getElementById('backTen').onclick=()=>video.currentTime=Math.max(0,video.currentTime-10);
document.getElementById('fwdTen').onclick=()=>video.currentTime=Math.min(video.duration,video.currentTime+10);

// ---------- 全屏 ----------
const player=document.getElementById('player');
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement){
    (player.requestFullscreen||player.webkitRequestFullscreen||function(){ if(video.webkitEnterFullscreen) video.webkitEnterFullscreen(); }).call(player);
  } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};

// ---------- 控制条自动隐藏 / 单击切换 ----------
let hideTimer=null;
function scheduleHide(){ clearTimeout(hideTimer); hideTimer=setTimeout(()=>player.classList.add('hidden-ui'),3000); }
function showUI(){ player.classList.remove('hidden-ui'); scheduleHide(); }
showUI();

// ---------- 手势 ----------
const gesture=document.getElementById('gesture');
const feedback=document.getElementById('feedback');
let fbTimer=null;
function showFeedback(html){ feedback.innerHTML=html; feedback.style.opacity='1'; clearTimeout(fbTimer); fbTimer=setTimeout(()=>feedback.style.opacity='0',500); }

let touchState=null, lastTapTime=0, lastTapX=0, gestureBrightness=1, pinchStartDist=null, pinchStartScale=1, curScale=1;

function applyFilters(){
  const b=gestureBrightness*(enhOn?enhBright:1);
  const c=enhOn?enhContrast:1, s=enhOn?enhSat:1;
  video.style.filter = enhOn && enhSharp>0
    ? `brightness(${b}) contrast(${c}) saturate(${s}) url(#sharpenFilter)`
    : `brightness(${b}) contrast(${c}) saturate(${s})`;
}

gesture.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStartDist=Math.hypot(dx,dy); pinchStartScale=curScale; touchState=null; return;
  }
  const t=e.touches[0];
  touchState={x:t.clientX,y:t.clientY,time:Date.now(),moved:false,mode:null,
    startTime:video.currentTime, startVol:video.volume, startBright:gestureBrightness};
},{passive:true});

gesture.addEventListener('touchmove',e=>{
  if(e.touches.length===2 && pinchStartDist){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    curScale=Math.min(3,Math.max(1,pinchStartScale*(dist/pinchStartDist)));
    video.style.transform=`scale(${curScale})`;
    e.preventDefault(); return;
  }
  if(!touchState) return;
  const t=e.touches[0]; const dx=t.clientX-touchState.x, dy=t.clientY-touchState.y;
  if(!touchState.mode){
    if(Math.abs(dx)>12 || Math.abs(dy)>12){
      touchState.mode = Math.abs(dx)>Math.abs(dy) ? 'seek' : (touchState.x < window.innerWidth/2 ? 'bright' : 'vol');
    } else return;
  }
  e.preventDefault();
  if(touchState.mode==='seek'){
    const nt=Math.min(video.duration,Math.max(0,touchState.startTime + dx/window.innerWidth*(video.duration||0)*1.2));
    video.currentTime=nt;
    showFeedback(`<svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span class="mono">${fmt(nt)}</span>`);
  } else if(touchState.mode==='vol'){
    const nv=Math.min(1,Math.max(0,touchState.startVol - dy/280));
    video.volume=nv; video.muted=false;
    showFeedback(`<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg><div class="bar-track"><div class="bar-fill" style="width:${nv*100}%"></div></div>`);
  } else if(touchState.mode==='bright'){
    gestureBrightness=Math.min(1.6,Math.max(0.4,touchState.startBright - dy/280));
    applyFilters();
    showFeedback(`<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 1v3M12 20v3M4.2 4.2l2 2M17.8 17.8l2 2M1 12h3M20 12h3M4.2 19.8l2-2M17.8 6.2l2-2"/></svg><div class="bar-track"><div class="bar-fill" style="width:${(gestureBrightness/1.6)*100}%"></div></div>`);
  }
},{passive:false});

gesture.addEventListener('touchend',e=>{
  if(e.touches.length===0) pinchStartDist=null;
  if(!touchState) return;
  if(!touchState.mode && Date.now()-touchState.time<300){
    const now=Date.now(), dxTap=touchState.x-lastTapX;
    if(now-lastTapTime<300 && Math.abs(dxTap)<60){
      if(touchState.x < window.innerWidth/2){
        video.currentTime=Math.max(0,video.currentTime-10);
        showFeedback(`<svg viewBox="0 0 24 24"><path d="M11 5V1L6 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H3c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg><span>-10秒</span>`);
      } else {
        video.currentTime=Math.min(video.duration,video.currentTime+10);
        showFeedback(`<svg viewBox="0 0 24 24"><path d="M13 5V1l5 5-5 5V7c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg><span>+10秒</span>`);
      }
      lastTapTime=0;
    } else {
      lastTapTime=now; lastTapX=touchState.x;
      setTimeout(()=>{ if(Date.now()-lastTapTime>=290) player.classList.contains('hidden-ui')?showUI():(clearTimeout(hideTimer),player.classList.add('hidden-ui')); },300);
    }
  }
  touchState=null;
},{passive:true});

// ---------- 画质增强 ----------
let enhOn=false, enhSharp=0, enhContrast=1, enhSat=1, enhBright=1;
const enhancePanel=document.getElementById('enhancePanel'), enhSwitch=document.getElementById('enhSwitch');
document.getElementById('enhanceBtn').onclick=()=>{ enhancePanel.style.display = enhancePanel.style.display==='block'?'none':'block'; };
enhSwitch.onclick=()=>{ enhOn=!enhOn; enhSwitch.classList.toggle('on',enhOn); applyFilters(); };
const sharpenMatrix=document.getElementById('sharpenMatrix');
function setSharp(v){
  enhSharp=v; const k=v/100;
  const center=1+4*k, side=-k;
  sharpenMatrix.setAttribute('kernelMatrix', `0 ${side} 0 ${side} ${center} ${side} 0 ${side} 0`);
  document.getElementById('vSharp').textContent=v; applyFilters();
}
document.getElementById('rSharp').addEventListener('input',e=>setSharp(+e.target.value));
document.getElementById('rContrast').addEventListener('input',e=>{ enhContrast=e.target.value/100; document.getElementById('vContrast').textContent=e.target.value+'%'; applyFilters(); });
document.getElementById('rSat').addEventListener('input',e=>{ enhSat=e.target.value/100; document.getElementById('vSat').textContent=e.target.value+'%'; applyFilters(); });
document.getElementById('rBright').addEventListener('input',e=>{ enhBright=e.target.value/100; document.getElementById('vBright').textContent=e.target.value+'%'; applyFilters(); });

const presets={
  off:{sharp:0,contrast:100,sat:100,bright:100,on:false},
  soft:{sharp:10,contrast:95,sat:95,bright:103,on:true},
  sharp:{sharp:55,contrast:112,sat:105,bright:100,on:true},
  vivid:{sharp:30,contrast:115,sat:135,bright:104,on:true}
};
document.querySelectorAll('.presetBtn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.presetBtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    const p=presets[btn.dataset.preset];
    enhOn=p.on; enhSwitch.classList.toggle('on',enhOn);
    document.getElementById('rSharp').value=p.sharp; setSharp(p.sharp);
    document.getElementById('rContrast').value=p.contrast; enhContrast=p.contrast/100; document.getElementById('vContrast').textContent=p.contrast+'%';
    document.getElementById('rSat').value=p.sat; enhSat=p.sat/100; document.getElementById('vSat').textContent=p.sat+'%';
    document.getElementById('rBright').value=p.bright; enhBright=p.bright/100; document.getElementById('vBright').textContent=p.bright+'%';
    applyFilters();
  };
});
</script>
</body>
</html>
